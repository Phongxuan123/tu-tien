<!doctype html><meta charset="utf-8"><title>Thử hình yêu thú</title>
<body style="background:#1a1e2a;color:#cfd6e4;font:12px monospace;margin:8px"><div id="g" style="display:grid;grid-template-columns:repeat(4,190px);gap:6px"></div>
<script src="js/files.js"></script><script>TT_LOAD(false);</script><script src="js/ui/sprites.js"></script>
<script>
window.addEventListener('load', function () {
  const g = document.getElementById('g');
  TT.ui.sprites.ids.forEach(function (id) {
    const d = TT.data.monsterById[id], c = document.createElement('canvas'); c.width = 120; c.height = 64; c.style.cssText = 'width:190px;height:127px;image-rendering:pixelated;background:#2a3042';
    const x = c.getContext('2d'); const R = function (a, b, w, h, col) { x.fillStyle = col; x.fillRect(a, b, w, h); };
    R(0, 54, 120, 10, '#3a4a38'); TT.ui.sprites.monster(R, id, 60, 54, 0);
    const w = document.createElement('div'); w.innerHTML = id + ' · ' + d.elem + (d.boss ? ' · boss' : ''); w.appendChild(c); g.appendChild(w);
  });
});
</script>
