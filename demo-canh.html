<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cảnh tu tiên - bản demo</title>
<style>
:root{--bg:#0d1213;--panel:#151d1e;--line:#26393a;--text:#e6efe9;--dim:#8fa5a0;--jade:#5ee0c4;--red:#c8362c;--gold:#ecc873}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
main{max-width:1500px;margin:0 auto;padding:12px 12px 28px}
h1{font:600 18px/1.3 'Cambria','Times New Roman',serif;margin:4px 0 2px;letter-spacing:.02em}
.sub{color:var(--dim);font-size:12.5px;margin:0 0 10px}
.cmp{display:grid;grid-template-columns:1fr;gap:10px}
.cmp.on{grid-template-columns:1fr 1fr}
.box{position:relative;background:#000;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.box canvas,.box img{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
.box canvas{aspect-ratio:10/3;margin:0 auto;touch-action:manipulation}
#oldbox{display:none;align-self:start}
.cmp.on #oldbox{display:block}
.cap{position:absolute;left:6px;top:6px;font-size:11px;background:#000a;color:#cfe;padding:1px 6px;border-radius:3px;pointer-events:none}
#dbg{position:absolute;right:6px;top:6px;font:11px/1.3 ui-monospace,Menlo,Consolas,monospace;background:#000b;color:#8f8;padding:2px 6px;border-radius:3px;pointer-events:none;display:none;white-space:pre}
.panel{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;gap:10px 22px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grp h2{font-size:11px;font-weight:600;color:var(--dim);margin:0 0 5px;text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;flex-wrap:wrap;gap:5px}
button{font:inherit;font-size:13px;color:var(--text);background:#1d2829;border:1px solid #30484a;border-radius:4px;padding:6px 10px;min-height:34px;cursor:pointer}
button:hover{border-color:var(--jade)}
button[aria-pressed=true]{background:#1f4a44;border-color:var(--jade);color:#fff}
button.ev{background:#35201f;border-color:#6a3430}
button.ev:hover{border-color:var(--gold)}
button.ev.run{background:#6a2a24;border-color:var(--gold)}
.sw{width:34px;padding:0;border-radius:50%;min-height:34px}
.sw[aria-pressed=true]{outline:2px solid var(--jade);outline-offset:1px}
.tg{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;min-height:34px}
.tg input{width:18px;height:18px;accent-color:#3fd0b4}
@media(max-width:700px){.cmp.on{grid-template-columns:1fr}main{padding:8px}button{padding:7px 9px}}
</style>
</head>
<body>
<main>
<h1>Cảnh tu tiên · pixel thủy mặc</h1>
<p class="sub">Bản demo cho cảnh đầu cột. 480×144, vẽ hoàn toàn bằng mã, không dùng ảnh ngoài. Rê chuột / chạm để nghiêng nhẹ cảnh.</p>
<div class="cmp" id="cmp">
  <div class="box" id="newbox"><canvas id="cv" width="480" height="144" aria-label="Cảnh tu tiên"></canvas><div id="dbg"></div></div>
  <div class="box" id="oldbox"><img id="oldimg" src="demo-canh-cu.png" alt="Cảnh hiện tại của game"><div class="cap">Cảnh hiện tại của game (240×72)</div></div>
</div>
<section class="panel">
  <div class="grp"><h2>Cảnh</h2><div class="row" id="g-scene"></div></div>
  <div class="grp"><h2>Giờ</h2><div class="row" id="g-time"></div></div>
  <div class="grp"><h2>Mùa</h2><div class="row" id="g-season"></div></div>
  <div class="grp"><h2>Màu áo</h2><div class="row" id="g-robe"></div></div>
  <div class="grp"><h2>Sự kiện</h2><div class="row" id="g-ev"></div></div>
  <div class="grp"><h2>Khác</h2><div class="row"><button id="b-old" aria-pressed="false">Cảnh cũ</button></div>
    <label class="tg" style="margin-top:6px"><input type="checkbox" id="c-red"> Giảm hiệu ứng</label></div>
</section>
</main>
<script>
(() => {
'use strict';
// ===================== tiện ích =====================

  mkPal('#35305e #a34f6c #f4a066 #e8a88c #b8788a #8c5a7c #5a4268 #2e2848 #a8707c #1c1830 #2a3a40 #5a6a64 #ffd2a8 #e8a0a0 #a8628a #3a3040 #7a5a70 #e8c4a8 #b8302c #6e1c24 #ffd070 #ff5a38 #1c1626 #6ae8d0 #ffb060', [.95, 255, 108, 17, 0, .15, .65, .3, .3]),

    KEYS.forEach(k => { p[k] = ['gold', 'lamp', 'jade', 'sun', 'wall'].includes(k) ? MA[k] : mix(MA[k], MA.ink, 1 - b); });

function lerpPal(a, b, t) { const o = {}; KEYS.forEach(k => o[k] = t <= 0 ? a[k] : t >= 1 ? b[k] : mix(a[k], b[k], t)); NUMS.forEach(k => o[k] = lerp(a[k], b[k], t)); return o; }

let FD = 1; const FDUR = 1.3; // tiến độ chuyển màu 0..1

const B = { sky: new Buf(W, H), far: new Buf(EW, H), mid: new Buf(EW, H), flt: new Buf(EW, H), near: new Buf(EW, H), arch: new Buf(W, H), over: new Buf(W, H),
  high: new Buf(960, 60), sea: new Buf(960, 96), front: new Buf(960, 44), fog: new Buf(960, 34) };

// ===================== phần tử tả cảnh =====================
const SEASONS = ['Xuân', 'Hạ', 'Thu', 'Đông'];
let SEA = 0; // mùa đang vẽ
const CANOPY = [['#f2a7b8', '#ffd9e0', '#c97090'], ['#4f9a5e', '#7fc080', '#2c6a46'], ['#d4502c', '#f0902e', '#8e2a1e'], ['#b8c4c8', '#f4f8f8', '#8a9aa2']];

function tower(x, base, w, h, style, c, r) {
  const tops = new Array(w), nl = 3 + Math.floor(r() * 3), ledges = [];
  for (let i = 0; i < nl; i++) ledges.push(base - h * (.15 + r() * .65));
  for (let dx = 0; dx < w; dx++) {
    const u = ((dx + .5) / w) * 2 - 1, a = Math.abs(u);
    const f = style === 'spire' ? 1 - Math.pow(a, 1.35) : style === 'mesa' ? Math.pow(Math.max(0, 1 - Math.pow(a, 9)), .5) : Math.pow(Math.max(0, 1 - Math.pow(a, 5)), .55);

const rockCols = (pal, key, ct) => ({ base: pal[key], lt: mix(pal[key], pal.rockLt, .5 * ct), lt2: mix(pal[key], pal.rockLt, .85 * ct), dk: mix(pal[key], pal.rockDk, .42 * ct), dk2: mix(pal[key], pal.rockDk, .66 * ct), cap: S_ma() ? null : mix(pal[key], pal.pine, .3 + .35 * ct), snow: SEA === 3 ? mix(pal.cloudLt, pal.mist, .15) : null });

  R(x, y - h, 1, h, c); ell(x, y - h + 1, 2, 1, c); ell(x, y - Math.round(h * .55), 3, 1, c); if (h > 6) ell(x, y - Math.round(h * .25), 3, 1, c);

function tree(x, y, h, pal, T, r, big) { // cây lá rộng theo mùa

    ts.forEach((s, i) => { if (!e.struck[i] && et >= s) { e.struck[i] = true; const c = evChar(); e.bolts[i] = { b: bolt(c.x + (rnd() - .5) * 24, 22, c.x, c.y - 26, e.seed + i * 17), t: et }; if (!S.red) flash = .75; burst(c.x, c.y - 10, Math.round(26 * fx), ['#ffffff', '#c0b8ff', '#8aa0ff'], 70, 30, .8, 1); } });
  } else if (e.n === 'kiem') {
    const p = kiemPath(et, e.x0); if (p.fly) { ch.fly = p; if (rnd() < 60 * dt * fx) PT.push({ k: 3, x: p.x - p.dir * 8, y: p.y + 1, vx: -p.dir * 10, vy: (rnd() - .5) * 8, g: 0, dr: .96, l: 0, m: .7, col: rnd() < .5 ? '#7af4dc' : '#ffffff', sz: 1 }); }
    if (!e.lift && et >= .7) { e.lift = true; burst(e.x0, GY + 1, Math.round(16 * fx), ['#e8e4d0', '#cfd8c8'], 40, 30, .7, 1); }
    if (!e.land && et >= 4.65) { e.land = true; burst(e.x0, GY + 1, Math.round(20 * fx), ['#e8e4d0', '#cfd8c8', '#7af4dc'], 50, 30, .8, 1); }
  }
  if (et >= e.d) { EV = null; ch.fly = null; ch.mode = 'idle'; ch.tm = 0; ch.wait = 1.5; document.querySelectorAll('.ev').forEach(b => b.classList.remove('run')); }
}
function kiemPath(et, x0) {
  const A = 0.7, B1 = 4.65;
  if (et < A) return { fly: false, x: x0, y: GY + 3 };
  if (et > B1) return { fly: false, x: x0, y: GY + 3 };
  const u0 = (et - A) / (B1 - A), u = smooth(u0) * .85 + u0 * .15, f = uu => { const cc = (240 - x0) * .6; return [clamp(x0 + 150 * Math.sin(2 * Math.PI * uu) * (x0 > 240 ? -1 : 1) + cc * Math.sin(Math.PI * uu), 14, W - 14), GY + 3 - 78 * Math.pow(Math.sin(Math.PI * uu), .75) - 12 * Math.sin(4 * Math.PI * uu) * Math.sin(Math.PI * uu)]; };
  const a = f(u), b = f(Math.min(1, u + .01)); return { fly: true, x: a[0], y: a[1], dir: Math.sign(b[0] - a[0]) || 1 };
}
function drawEventUnder(pal, t) { // dưới nhân vật
  const e = EV; if (!e) return; const et = e.t, c = evChar();
  if (e.n === 'kiep') { const dk = et < 1 ? et : et > e.d - .9 ? (e.d - et) / .9 : 1; ctx.globalAlpha = .68 * clamp(dk, 0, 1); ctx.fillStyle = '#060418'; ctx.fillRect(-4, -4, W + 8, H + 8); ctx.globalAlpha = 1; }
  if (e.n === 'dotpha') { const cx = c.x, cy = c.y - 12; g = ctx;
    const h = clamp(et / 2.9, 0, 1); ctx.globalAlpha = .12 * h + (et > 2.9 ? .1 * Math.max(0, 1 - (et - 2.9) / 1.2) : 0); disc(cx, cy, 14 + Math.round(3 * Math.sin(t * 8)), '#bffff0'); ctx.globalAlpha = .12 * h; disc(cx, cy, 24, '#7af4dc'); ctx.globalAlpha = 1;
    if (et > 2.9) { const k = et - 2.9; ctx.globalAlpha = Math.max(0, .55 - k * .3); ctx.fillStyle = '#d8fff4'; ctx.fillRect(Math.round(cx) - 4, 0, 9, Math.round(cy)); ctx.globalAlpha = Math.max(0, .5 - k * .3); ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.round(cx) - 1, 0, 3, Math.round(cy)); ctx.globalAlpha = 1; } }
}
function drawEventOver(pal, t) { // trên cùng
  const e = EV; if (!e) { return; } const et = e.t, c = evChar(), fx = FX();
  if (e.n === 'dotpha') { const cx = c.x, cy = c.y - 12;
    if (et > 2.9) { const k = et - 2.9; ringPts(cx, cy, k * 100, '#7af4dc', Math.max(0, .5 - k / 3), 5); ringPts(cx, cy, k * 100, '#ffffff', Math.max(0, 1.1 - k / 1.4), 2); ringPts(cx, cy, Math.max(0, (k - .25)) * 76, '#7af4dc', Math.max(0, 1 - k / 1.4), 3); ringPts(cx, cy, Math.max(0, (k - .5)) * 58, '#ecc873', Math.max(0, 1 - k / 1.3), 2); }
  } else if (e.n === 'kiep') {
    const dk = et < 1 ? et : et > e.d - .9 ? (e.d - et) / .9 : 1, d = clamp(dk, 0, 1);
    // mây đen xoáy
    const cx = c.x, cy = 24, gr = clamp(et / 1.1, 0, 1) * (et > e.d - .9 ? d : 1);
    const cols = ['#0e0820', '#1c1236', '#2c2050'], n = S.red ? 16 : 34; g = ctx;
    const pos = i => { const L = i % 3, rad = (8 + (i * 37 % 52)) * gr, an = i * 2.4 + t * (.9 - L * .2); return [cx + Math.cos(an) * rad * 1.5, cy + Math.sin(an) * rad * .2 + L * 4 - 6, an, L]; };
    for (let i = 0; i < n; i++) { const [x, y, an, L] = pos(i); ctx.globalAlpha = .96 * Math.min(1, gr * 1.5); ell(x, y, Math.round((14 + (i % 5) * 3) * gr), Math.round((5 + (i % 3) * 2) * gr), cols[L]); }
    for (let i = 0; i < n; i++) { const [x, y, an, L] = pos(i); if (Math.sin(an) > .1) { ctx.globalAlpha = .8 * gr; ell(x - 2, y - 2, Math.round((9 + (i % 4) * 2) * gr), Math.round((3 + (i % 2)) * gr), '#42366e'); } }
    const pre = e.struck.findIndex(v => !v), nt = [1.5, 2.6, 3.7][pre < 0 ? 2 : pre]; if (pre >= 0 && nt - et < .5 && !S.red) { ctx.globalAlpha = (1 - (nt - et) / .5) * .5; ell(cx, cy, 34, 7, '#b4a8ff'); }
    ctx.globalAlpha = 1;
    // mưa
    if (!S.red) { ctx.fillStyle = '#8fa4d0'; ctx.globalAlpha = .35 * d; for (let i = 0; i < 70; i++) { const x = (hash(i) * (W + 40) + t * 70) % (W + 40) - 20, y = (hash(i + 99) * H + t * 280 + i * 13) % H; ctx.fillRect(Math.round(x), Math.round(y), 1, 4); } ctx.globalAlpha = 1; }
    e.bolts.forEach(bb => { if (!bb) return; const k = et - bb.t; if (k < .3) drawBolt(bb.b, k < .06 ? 1 : k < .2 ? .9 : .5); });
  } else if (e.n === 'kiem') { }
  if (flash > .01) { ctx.globalAlpha = flash; ctx.fillStyle = e && e.n === 'kiep' ? '#f4f0ff' : '#eafffa'; ctx.fillRect(-4, -4, W + 8, H + 8); ctx.globalAlpha = 1; }
}

// ===================== nhân vật: hành vi + vẽ =====================
function updateChar(dt) {
  ch.tm += dt; if (EV) return;
  if (ch.mode === 'idle') { if (ch.tm > ch.wait) { let tx; do { tx = 50 + rnd() * 380; } while (Math.abs(tx - ch.x) < 70); ch.tx = tx; ch.mode = 'walk'; ch.dir = tx > ch.x ? 1 : -1; ch.tm = 0; } }
  else if (ch.mode === 'walk') { ch.x += ch.dir * 22 * dt; if ((ch.dir > 0 && ch.x >= ch.tx) || (ch.dir < 0 && ch.x <= ch.tx)) { ch.mode = 'idle'; ch.tm = 0; ch.wait = 2.5 + rnd() * 3.5; } }
}
function charDraw(pal, t) {
  let x = ch.x, y = GY + 3, dir = ch.dir, glow = 0, key = ch.mode === 'walk' ? 'w' + (Math.floor(ch.tm * 7) % 4) : (Math.floor(ch.tm / .9) % 2 ? 'i1' : 'i0');
  const e = EV;
  if (e) {
    const et = e.t; key = Math.floor(t * 1.1) % 2 ? 'i1' : 'i0';
    if (e.n === 'dotpha') glow = et < 2.9 ? et / 2.9 * .55 : et < 3.4 ? 1 : Math.max(0, 1 - (et - 3.4) / 1.2) * .9;
    else if (e.n === 'kiep') e.bolts.forEach(b => { if (b) { const k = et - b.t; if (k < .3) glow = Math.max(glow, (Math.floor(k * 30) % 2 ? .9 : .3) * (1 - k / .3)); } });
    else if (e.n === 'kiem') {
      const p = kiemPath(et, e.x0); dir = ch.dir;
      if (p.fly) { x = p.x; y = p.y; dir = p.dir; key = Math.floor(t * 6) % 2 ? 'i1' : 'i0'; drawSwordUnder(x, y, dir, 24, pal); glow = .15; }
      else { const L = et < .7 ? 24 * smooth(et / .7) : 24 * clamp((e.d - et) / (e.d - 4.65), 0, 1); if (L > 1) drawSwordUnder(x, y, dir, L, pal); if (et < .7) glow = .4 * smooth(et / .7); }
    }
  }
  drawChar(x, y, key, dir, glow, pal);
}

// ===================== dựng lại cảnh khi đổi cảnh / giờ / mùa =====================
const cam = { sway: 0, ptr: 0, ptrT: 0 }; let D = 0, first = true;
function rebuild() {
  const key = S.scene + '|' + S.phase + '|' + S.season; if (key === builtKey) return;
  sceneChanged = S.scene !== builtScene; builtScene = S.scene; SEA = S.season;
  const pal = palFor(S.scene, S.phase, S.season), T = c => mix(mix(c, pal.mist, .1 * (1 - pal.amb)), pal.m4, pal.amb * .65);
  palFrom = palCur || pal; palTo = pal; if (first) palCur = pal;
  paintScene(pal, S.scene, T); FD = first ? 1 : 0; first = false; builtKey = key; resetDyn();
}
const offX = k => Math.round(-PAD + (cam.sway + cam.ptr * 8) * k);
function render(t, dt) {
  const pal = palCur, sc = S.scene, geo = geoFor(sc), ox = FX() === 1 ? 0 : 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  if (shx || shy) { ctx.fillStyle = '#05040c'; ctx.fillRect(0, 0, W, H); }
  ctx.translate(shx, shy);
  B.sky.draw(ctx, 0, 0);
  drawSkyObjs(pal, t);
  strip(B.high, D * 2.2, 4, .85);
  B.far.draw(ctx, offX(.15), 0); strip(B.sea, D * 1.8 + 420, SC[sc].seaY - 40, .8); B.mid.draw(ctx, offX(.25), 0); B.flt.draw(ctx, offX(.32), 0); drawFalls(pal, t, offX(.32));
  strip(B.sea, D * 3.2, SC[sc].seaY - 14, 1);
  drawCranes(pal, t, dt);
  B.near.draw(ctx, offX(.4), 0);
  strip(B.front, D * 6.5 + 300, GY - 40, .92);
  drawSwords(pal, t, dt);
  B.arch.draw(ctx, 0, 0);
  drawLamps(pal, t, geo); drawFlags(pal, t, geo);
  strip(B.fog, D * 9, GY - 22, .5);
  drawFireflies(pal, t);
  drawEventUnder(pal, t);
  charDraw(pal, t);
  B.over.draw(ctx, 0, 0);
  drawPart(pal, t);
  strip(B.fog, -D * 7 + 500, GY - 8, .28);
  drawEventOver(pal, t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
function update(dt) {
  T0 += dt; D += dt * FX();
  if (S.auto) { autoT += dt; if (autoT > 16) { autoT = 0; setPhase((S.phase + 1) % 4, true); } }
  rebuild();
  if (FD < 1) { FD = Math.min(1, FD + dt / FDUR); palCur = lerpPal(palFrom, palTo, smooth(FD)); } else palCur = palTo;
  cam.sway = Math.sin(T0 * .06) * 10; cam.ptr += (cam.ptrT - cam.ptr) * Math.min(1, dt * 3);
  stepPart(dt); updateChar(dt); if (EV) updateEvent(dt, T0);
  flash = Math.max(0, flash - dt * 3.2);
  if (EV && EV.n === 'kiep' && !S.red) { let s = 0; EV.bolts.forEach(b => { if (b) { const k = EV.t - b.t; if (k < .4) s = Math.max(s, 1 - k / .4); } }); shx = Math.round(Math.sin(T0 * 91) * 2 * s); shy = Math.round(Math.cos(T0 * 77) * 1.5 * s); } else { shx = 0; shy = 0; }
}

// ===================== điều khiển =====================
const $ = id => document.getElementById(id);
const SCN = SC.map(s => s.name), TIMES = ['Sáng', 'Chiều', 'Hoàng hôn', 'Đêm'];
function mkRow(id, labels, get, set, extra) {
  const el = $(id); el.innerHTML = '';
  labels.forEach((l, i) => { const b = document.createElement('button'); b.textContent = l; b.onclick = () => set(i); b.dataset.i = i; if (extra) extra(b, i); el.appendChild(b); });
  return () => { [...el.children].forEach((b, i) => b.setAttribute('aria-pressed', String(get(i)))); };
}
let syncs = [];
const sync = () => syncs.forEach(f => f());
function setPhase(i, fromAuto) { S.phase = i; if (!fromAuto) { S.auto = false; autoT = 0; } sync(); }
syncs.push(mkRow('g-scene', SCN, i => S.scene === i, i => { S.scene = i; sync(); }));
{
  const el = $('g-time'); const f = mkRow('g-time', TIMES, i => !S.auto && S.phase === i, i => setPhase(i));
  const b = document.createElement('button'); b.textContent = 'Tự chạy theo giờ'; b.id = 'b-auto'; b.onclick = () => { S.auto = !S.auto; autoT = 0; sync(); }; el.appendChild(b);
  syncs.push(() => { f(); b.setAttribute('aria-pressed', String(S.auto)); });
}
syncs.push(mkRow('g-season', SEASONS, i => S.season === i, i => { S.season = i; sync(); }));
syncs.push(mkRow('g-robe', ROBES.map(r => r.n), i => S.robe === i, i => { S.robe = i; sync(); }, (b, i) => { b.className = 'sw'; b.textContent = ''; b.title = ROBES[i].n; b.style.background = ROBES[i].sw; b.setAttribute('aria-label', ROBES[i].n); }));
{
  const el = $('g-ev'); [['dotpha', 'Đột phá'], ['kiep', 'Thiên kiếp'], ['kiem', 'Ngự kiếm']].forEach(([k, n]) => { const b = document.createElement('button'); b.className = 'ev'; b.dataset.ev = k; b.textContent = n; b.onclick = () => startEvent(k); el.appendChild(b); });
}
$('b-old').onclick = () => { S.old = !S.old; $('b-old').setAttribute('aria-pressed', String(S.old)); $('cmp').classList.toggle('on', S.old); fit(); };
$('c-red').checked = S.red; $('c-red').onchange = e => { S.red = e.target.checked; };
$('oldimg').onerror = () => { $('oldbox').querySelector('.cap').textContent = 'Không thấy demo-canh-cu.png'; };
cv.addEventListener('pointermove', e => { const r = cv.getBoundingClientRect(); cam.ptrT = clamp(((e.clientX - r.left) / r.width - .5) * 2, -1, 1); });
cv.addEventListener('pointerleave', () => { cam.ptrT = 0; });
function fit() {
  const box = $('newbox'), pw = box.parentElement.clientWidth * (S.old && innerWidth > 700 ? .5 : 1) - 2, dpr = window.devicePixelRatio || 1;
  const ratio = pw * dpr / 480, n = Math.floor(ratio); if (n >= 1 && ratio / n < 1.12) cv.style.width = (480 * n / dpr) + 'px'; else cv.style.width = '100%';
}
addEventListener('resize', fit);

// ===================== vòng lặp + đo hiệu năng =====================
const DBG = Q.get('debug') === '1', perf = { a: [], max: 0, avg: 0, p95: 0, n: 0 }; let paused = false, last = performance.now(), dbgN = 0;
if (DBG) $('dbg').style.display = 'block';
function recPerf(ms) {
  perf.a.push(ms); if (perf.a.length > 240) perf.a.shift(); perf.n++;
  if (++dbgN % 20 === 0) { const s = perf.a.slice().sort((x, y) => x - y); perf.avg = s.reduce((p, c) => p + c, 0) / s.length; perf.p95 = s[Math.floor(s.length * .95)]; perf.max = s[s.length - 1]; if (DBG) $('dbg').textContent = 'vẽ ' + perf.avg.toFixed(2) + ' ms (p95 ' + perf.p95.toFixed(2) + ', max ' + perf.max.toFixed(2) + ')\nhạt ' + PT.length; }
}
function loop(now) {
  requestAnimationFrame(loop); if (paused) { last = now; return; }
  const dt = Math.min(.05, (now - last) / 1000); last = now; if (dt <= 0) return;
  const a = performance.now(); update(dt); render(T0, dt); recPerf(performance.now() - a);
}
bakeChar(); sync(); fit(); rebuild(); resetDyn();
window.__demo = {
  S, ch, perf, spr: SPR, pause: v => { paused = v; }, event: startEvent,
  advance(sec) { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) update(1 / 60); render(T0, 1 / 60); },
  spawnSword, spawnCranes: () => { spawnCranes(); }, flock: () => cranes,
  set(o) { Object.assign(S, o); sync(); }, place(x) { ch.x = x; ch.tx = x; ch.mode = 'idle'; ch.tm = 0; ch.wait = 99; ch.dir = 1; }, wait: () => FD >= 1
};
requestAnimationFrame(loop);
})();
