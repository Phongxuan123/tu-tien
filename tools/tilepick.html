<!doctype html><meta charset="utf-8"><body style="background:#223;margin:0"><canvas id="c"></canvas><script>
const img=new Image();img.src='../assets/cc0/kenney-pixel-platformer/Tilemap/tilemap_packed.png';
img.onload=()=>{const S=4,T=18,cols=img.width/T,rows=img.height/T,c=document.getElementById('c');c.width=img.width*S;c.height=img.height*S;const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(img,0,0,c.width,c.height);x.font='10px monospace';x.fillStyle='#fff';x.strokeStyle='rgba(255,255,255,.25)';
for(let r=0;r<rows;r++)for(let q=0;q<cols;q++){x.strokeRect(q*T*S,r*T*S,T*S,T*S);x.fillStyle='#ff0';x.fillText(r*cols+q,q*T*S+2,r*T*S+10);}
document.title=img.width+'x'+img.height+' cols'+cols+' rows'+rows;};
</script>
