<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Kiểm thử</title>
<style>
body{font-family:Consolas,monospace;background:#14110f;color:#e8dfd0;padding:16px}
.ok{color:#6fa86b}.fail{color:#c4553f}.info{color:#9a8f7e}
</style>
</head>
<body>
<h2>Kiểm thử</h2>
<div id="out"></div>
<script src="js/files.js"></script>
<script>TT_LOAD(false);</script>
<script src="js/ui/icons.js"></script>
<script src="js/ui/bldart.js"></script>
<script src="js/data/natevents.js"></script>
<script>
const out = document.getElementById('out');
let pass = 0, failN = 0;
function line(cls, t) { const d = document.createElement('div'); d.className = cls; d.textContent = t; out.appendChild(d); }
// Các bài kiểm thử chạy lần lượt, mỗi bài một lượt setTimeout để trang không bị treo và đọc kết quả giữa chừng được.
const queue = [];
// ?only=từ khóa  chỉ chạy các bài có tên chứa từ khóa (lặp nhanh khi làm một chặng); không có tham số thì chạy tất cả.
const ONLY = new URLSearchParams(location.search).get('only');
function test(name, fn) { if (ONLY && name.indexOf(ONLY) < 0) return; queue.push([name, fn]); }
// Cho người chơi một lịch sử tốc độ tốt để dựng được nhiệm vụ ở mọi tầng.
function primeQuests(p) { const s = TT.quests.qs(p), a = TT.age(p); s.h = []; for (let i = 0; i < 6; i++) s.h.push({ a: a - 5 + i, L: i * 0.03, w: i * 60, d: i }); }
function runNext() {
  const item = queue.shift();
  if (!item) {
    line(failN ? 'fail' : 'ok', '--- ' + pass + ' đạt, ' + failN + ' lỗi ---');
    document.title = failN ? 'FAIL ' + failN : 'PASS ' + pass;
    window.__done = true;
    return;
  }
  document.title = 'Đang chạy: ' + item[0];
  const t0 = performance.now();
  try { const r = item[1](); if (r === false) throw new Error('trả về false'); pass++; line('ok', 'ĐẠT  ' + item[0] + ' (' + Math.round(performance.now() - t0) + ' ms)'); }
  catch (e) { failN++; line('fail', 'LỖI  ' + item[0] + ' -> ' + e.message); console.error(e); }
  setTimeout(runNext, 0);
}
function eq(a, b, msg) { if (a !== b) throw new Error((msg || '') + ' mong ' + b + ', nhận ' + a); }
function ok(cond, msg) { if (!cond) throw new Error(msg || 'điều kiện sai'); }
const TT = window.TT, D = TT.data, S = TT.stats;
TT.config.autosaveMonths = 1e12; // không để bài kiểm thử ghi đè bản lưu của game thật
TT.config.persistMeta = false;   // và không làm bẩn bộ sưu tập kết cục thật
const Y100 = 1200;

function fingerprint() {
  const w = TT.world;
  return Object.keys(w.chars).map(id => {
    const c = w.chars[id];
    return id + ':' + c.alive + ':' + c.realm + ':' + Math.floor(c.xp) + ':' + Math.floor(c.hp) + ':' + c.focus + ':' + c.region + ':' + c.place;
  }).join('|') + '#' + w.months + '#' + Object.keys(w.regions).join(',');
}
// Đưa người chơi tới cửa ải của một vùng (dựng vùng nếu chưa có) để thử nghiệm.
function moveTo(rid, place) {
  const p = TT.player();
  TT.life.enterRegion(rid);
  p.region = rid; p.place = place || TT.map.gateOf(rid); p.travel = null; p.cross = null; p.dest = null;
  p.knownRegions[rid] = true;
  TT.map.ensureTaste(p);
  return p;
}
function coreIn(rid) { return Object.values(TT.world.chars).filter(c => c.alive && c.kind === 'npc' && c.tier === 'core' && c.region === rid); }
function roleIn(rid) { return Object.values(TT.world.chars).filter(c => c.alive && c.tier === 'phu' && c.region === rid); }

test('RNG cùng hạt giống cho cùng dãy số', () => {
  TT.rng.seed(5); const a = [TT.rng.next(), TT.rng.next(), TT.rng.next()];
  TT.rng.seed(5); const b = [TT.rng.next(), TT.rng.next(), TT.rng.next()];
  eq(a.join(), b.join());
  return a.every(x => x >= 0 && x < 1);
});

test('Dữ liệu bản đồ: 9 vùng x 10 địa điểm, đường liên thông, mỗi vùng 1 cửa ải và 1 truyền tống trận', () => {
  eq(D.REGIONS.length, 9, 'số vùng');
  const seen = {};
  D.REGIONS.forEach(r => {
    const ps = TT.map.placesOf(r.id);
    eq(ps.length, 10, r.id + ' số địa điểm');
    ps.forEach(p => { ok(!seen[p.id], 'trùng id ' + p.id); seen[p.id] = 1; ok(D.PLACE_TYPES[p.type], 'loại lạ ' + p.type); });
    eq(ps.filter(p => p.gate).length, 1, r.id + ' cửa ải');
    eq(ps.filter(p => p.portal).length, 1, r.id + ' truyền tống');
    eq(TT.map.place(TT.map.gateOf(r.id)).type, 'cua_ai', r.id + ' loại cửa ải');
    ps.forEach(q => { ok(TT.map.localRoute(ps[0].id, q.id), r.id + ': không có đường ' + ps[0].id + ' -> ' + q.id); });
    ok(TT.map.macroNeighbors(r.id).length >= 2, r.id + ' ít láng giềng');
    ok(r.weather.length >= 1 && r.env, r.id + ' thiếu môi trường/thời tiết');
    r.origins.forEach(o => ok(ps.some(p => o.types.indexOf(p.type) >= 0), r.id + ': bối cảnh "' + o.name + '" không có nơi sinh'));
  });
  eq(D.REGIONS.reduce((a, r) => a + r.birth, 0), 100, 'tổng tỉ lệ sinh');
  // đại địa đồ liên thông
  const reach = { trung_chau: 1 }; let grew = true;
  while (grew) { grew = false; D.EDGES.forEach(e => { if (reach[e.a] && !reach[e.b]) { reach[e.b] = 1; grew = true; } if (reach[e.b] && !reach[e.a]) { reach[e.a] = 1; grew = true; } }); }
  eq(Object.keys(reach).length, 9, 'đại địa đồ liên thông');
});

test('Bố trí bản đồ: nằm trong khung và không chồng chéo', () => {
  D.REGIONS.forEach(r => {
    const ps = TT.map.placesOf(r.id);
    ps.forEach(p => ok(p.x >= 20 && p.x <= 780 && p.y >= 20 && p.y <= 540, r.id + ' ' + p.id + ' ngoài khung (' + p.x + ',' + p.y + ')'));
    for (let i = 0; i < ps.length; i++) for (let j = i + 1; j < ps.length; j++) {
      const d = Math.hypot(ps[i].x - ps[j].x, ps[i].y - ps[j].y);
      ok(d > 45, r.id + ': ' + ps[i].id + ' và ' + ps[j].id + ' quá gần (' + Math.round(d) + ')');
    }
  });
});

test('Tạo thế giới: chỉ vùng của người chơi có người, 15-20 NPC lõi cùng NPC phụ', () => {
  TT.life.createWorld(42);
  const w = TT.world, p = TT.player();
  eq(TT.age(p), 12, 'tuổi người chơi');
  ok(TT.map.place(p.place) && TT.map.place(p.place).region === p.region, 'địa điểm không thuộc vùng');
  eq(Object.keys(w.regions).length, 1, 'số vùng đã dựng');
  const core = coreIn(p.region).length, phu = roleIn(p.region).length;
  ok(core >= TT.config.coreMin - 1 && core <= TT.config.coreMax + 4, 'NPC lõi ' + core);
  ok(phu >= 10, 'NPC phụ ' + phu);
  line('info', '   vùng ' + p.region + ': ' + core + ' NPC lõi, ' + phu + ' NPC phụ');
});

test('Tư chất: tổng 50-200 và khớp tổng các thuộc tính', () => {
  for (let i = 0; i < 300; i++) {
    const c = TT.createChar({ kind: 'npc' });
    const sum = c.tuchat.attrs.reduce((a, x) => a + x.p, 0);
    if (sum !== c.tuchat.total || sum < 50 || sum > 200) throw new Error('tổng sai: ' + sum + ' / ' + c.tuchat.total);
  }
});

test('Nơi sinh: tỉ lệ theo vùng đúng trọng số và xuất thân khớp loại địa điểm', () => {
  TT.life.createWorld(8);
  const n = 4000, cnt = {};
  for (let i = 0; i < n; i++) {
    const c = TT.createChar({ kind: 'npc' });
    cnt[c.region] = (cnt[c.region] || 0) + 1;
    const origins = TT.map.region(c.region).origins.find(o => o.name === c.origin);
    ok(origins, 'xuất thân lạ ' + c.origin);
    ok(origins.types.indexOf(TT.map.place(c.place).type) >= 0 || TT.map.placesOf(c.region).every(p => origins.types.indexOf(p.type) < 0), 'nơi sinh không khớp loại');
  }
  const parts = [];
  D.REGIONS.forEach(r => {
    const got = (cnt[r.id] || 0) / n * 100;
    ok(Math.abs(got - r.birth) < 2.5, r.id + ' mong ' + r.birth + '%, nhận ' + got.toFixed(1) + '%');
    parts.push(r.id + ' ' + got.toFixed(1) + '%');
  });
  line('info', '   ' + parts.join(', '));
});

test('Di chuyển trong vùng: mất đúng số tháng và tới đích', () => {
  TT.life.createWorld(31);
  const p = moveTo('trung_chau', 'tc_vinh_do'); p.autoMove = false;
  const dest = 'tc_co_dao', expect = TT.map.localRoute('tc_vinh_do', dest).months;
  eq(TT.map.startTravel(p, dest), true, 'bắt đầu đi');
  const start = TT.world.months;
  let guard = 0;
  while ((p.travel || p.place !== dest) && guard++ < 100 && p.alive) { TT.life.stepWorld(); if (TT.world.pending) TT.decisions.resolve(0); }
  if (!p.alive) return true;
  eq(p.place, dest, 'địa điểm tới');
  const took = TT.world.months - start;
  ok(took >= expect, 'đi quá nhanh: ' + took + ' < ' + expect);   // thời tiết có thể làm chậm thêm
  ok(took <= expect * 2 + 2, 'đi quá chậm: ' + took);
});

test('Điều kiện vượt vùng: ải, truyền tống trận, thương đoàn, tông môn', () => {
  TT.life.createWorld(11);
  const p = moveTo('trung_chau', 'tc_vinh_do');
  eq(TT.cross.options(p).length, 0, 'ở thành trì thì không có lựa chọn vượt vùng');
  p.place = TT.map.gateOf('trung_chau'); p.realm = 0; p.gold = 0;
  let o = TT.cross.options(p).filter(x => x.method === 'tu_than');
  eq(o.length, TT.map.macroNeighbors('trung_chau').length, 'số tuyến tự thân');
  ok(o.every(x => !x.ok), 'phàm nhân không được tự thân vượt vùng');
  p.realm = 5;
  o = TT.cross.options(p).filter(x => x.method === 'tu_than');
  ok(o.every(x => x.ok), 'Hóa Thần đủ điều kiện mọi tuyến');
  const tay = o.find(x => x.to === 'tay_son');
  eq(tay.years, 100, 'Trung Châu - Tây Thiên Sơn ở Hóa Thần mất 100 năm (ví dụ trong thiết kế)');
  p.realm = 4; o = TT.cross.options(p).filter(x => x.method === 'tu_than');
  eq(o.find(x => x.to === 'tay_son').ok, false, 'Nguyên Anh chưa đủ để sang Tây Thiên Sơn');
  eq(o.find(x => x.to === 'dong_hai').ok, true, 'Nguyên Anh đủ để sang Đông Hải');
  // truyền tống trận
  p.place = TT.map.portalOf('trung_chau'); p.realm = 2; p.gold = 100; p.fortune = 0;
  o = TT.cross.options(p).filter(x => x.method === 'tran_phap');
  ok(o.length > 0 && o.every(x => !x.ok && x.why.length === 3), 'truyền tống trận: thiếu cảnh giới, vàng, cơ duyên');
  p.realm = 3; p.gold = 2000; p.fortune = 12;
  ok(TT.cross.options(p).filter(x => x.method === 'tran_phap').every(x => x.ok), 'đủ điều kiện truyền tống trận');
  // thương đoàn
  p.place = 'tc_van_bao'; p.realm = 1; p.gold = 0;
  o = TT.cross.options(p).filter(x => x.method === 'thuong_doan');
  ok(o.length > 0 && o.every(x => !x.ok), 'thương đoàn khắt khe với người yếu và nghèo');
  ok(!o.some(x => x.to === 'bac_bang'), 'không có tuyến thương đoàn tới Bắc Cực');
  p.realm = 2; p.gold = 5000;
  ok(TT.cross.options(p).filter(x => x.method === 'thuong_doan').every(x => x.ok), 'đủ điều kiện thương đoàn');
  // tông môn: luôn khóa
  p.place = 'tc_thanh_van';
  o = TT.cross.options(p);
  ok(o.length > 0 && o.every(x => x.method === 'tong_mon' && !x.ok), 'đại trận tông môn đang khóa');
});

test('Vượt vùng tự thân: đúng số năm, tu luyện giảm, vùng cũ đứng yên rồi được bù khi quay lại', () => {
  let done = false, lastErr = '';
  for (let seed = 77; seed < 90 && !done; seed++) {
    TT.life.createWorld(seed);
    const p = moveTo('trung_chau');
    const start = 'trung_chau', e = TT.map.edgeBetween(start, 'nam_lam'); // Nguyên Anh, 60 năm
    p.realm = 5; p.xp = 0; p.hp = S.hpMax(p) * 2; p.trainHp = 200; p.hp = S.hpMax(p);
    const key = 'tu_than:nam_lam', opt = TT.cross.options(p).find(o => o.key === key);
    const years = Math.round(e.years * Math.max(0.5, 1 - 0.25 * (5 - e.minRealm)));
    eq(opt.years, years, 'số năm');
    const t0 = TT.world.months, frozen = TT.world.regions[start].lastMonth;
    eq(TT.cross.start(p, key).ok, true, 'xuất phát');
    ok(p.cross && p.place === null, 'đang vượt vùng');
    let g = 0;
    while (p.cross && p.alive && g++ < years * 12 + 50) { if (TT.world.pending) TT.decisions.resolve(0); TT.life.stepWorld(); }
    if (!p.alive) { lastErr = 'chết dọc đường (seed ' + seed + ')'; continue; }
    eq(TT.world.months - t0, years * 12, 'thời gian đi');
    eq(p.region, 'nam_lam'); eq(p.place, TT.map.gateOf('nam_lam'), 'tới cửa ải đích');
    ok(TT.world.regions.nam_lam && TT.world.regions.nam_lam.populated, 'vùng đích được dựng');
    ok(p.knownRegions.nam_lam, 'biết vùng đích');
    ok(TT.world.regions[start].lastMonth <= frozen + 1, 'vùng cũ đứng yên trong lúc đi');
    ok(coreIn('nam_lam').length >= TT.config.coreMin - 1, 'dân số vùng đích');
    // quay lại: vùng cũ được bù thời gian
    TT.life.enterRegion(start);
    eq(TT.world.regions[start].lastMonth, TT.world.months, 'đã bù thời gian');
    ok(coreIn(start).length >= TT.config.coreMin, 'dân số vùng cũ sau khi bù: ' + coreIn(start).length);
    done = true;
  }
  if (!done) throw new Error(lastErr || 'không thành công');
});

test('Truyền tống trận: tỉ lệ thành công hợp lý, tức thì, thất bại gây thương nặng', () => {
  TT.life.createWorld(5);
  const p0 = TT.player();
  let succ = 0, fail = 0, instant = true;
  for (let i = 0; i < 120; i++) {
    const p = moveTo('trung_chau', TT.map.portalOf('trung_chau'));
    p.alive = true; p.deathMonth = null; TT.world.pending = null;
    p.realm = 3; p.gold = 2000; p.fortune = 12; p.hp = S.hpMax(p); p.baseLuck = 0; p.baseKv = 0;
    const key = 'tran_phap:tay_son', t0 = TT.world.months;
    TT.cross.start(p, key);
    if (TT.world.months !== t0) instant = false;
    if (p.region === 'tay_son') succ++; else { fail++; ok(p.hp < S.hpMax(p), 'thất bại phải bị thương'); }
  }
  ok(instant, 'truyền tống phải tức thì');
  const rate = succ / (succ + fail);
  line('info', '   thành công ' + succ + '/' + (succ + fail) + ' (' + Math.round(rate * 100) + '%)');
  ok(rate > 0.25 && rate < 0.6, 'tỉ lệ ' + rate);
});

test('Môi trường: kháng giảm hao sinh lực; thời tiết xuất hiện và có cả lợi lẫn hại', () => {
  TT.life.createWorld(13);
  const p = moveTo('bac_bang', 'bb_han_thanh');
  p.tuchat = { total: 80, attrs: [{ n: 'Kim', di: false, p: 80 }] };
  const weak = TT.map.effects(p).hpDrain;
  p.tuchat = { total: 80, attrs: [{ n: 'Băng', di: true, p: 80 }] }; p.realm = 0;
  const strong = TT.map.effects(p).hpDrain;
  ok(strong < weak * 0.3, 'tư chất Băng phải kháng giá rét: ' + weak.toFixed(2) + ' vs ' + strong.toFixed(2));
  const seen = {};
  for (let i = 0; i < 1200; i++) {
    TT.life.stepWorld(); if (TT.world.pending) TT.decisions.resolve(0);
    const wx = TT.map.activeWeather(TT.player().region);
    if (wx) seen[wx.def.id] = (seen[wx.def.id] || 0) + 1;
    if (!TT.player().alive) break;
  }
  line('info', '   thời tiết ở vùng người chơi sau tối đa 100 năm: ' + JSON.stringify(seen));
  ok(Object.keys(seen).length >= 1, 'phải có thời tiết');
});

test('Du hành giả và khách lạ: có người rời vùng, có khách từ vùng khác tới', () => {
  TT.life.createWorld(21);
  const p = TT.player(); p.realm = 3; p.baseKv = 100;
  // Đếm qua tin tức (bản tin bị giới hạn độ dài nên không đếm bằng danh sách cuối).
  const origNews = TT.news; let leaves = 0, arrivals = 0;
  TT.news = function (t) { if (/đã rời/.test(t)) leaves++; if (/khách lạ/.test(t)) arrivals++; return origNews.apply(this, arguments); };
  try {
    for (let i = 0; i < 12 * 300; i++) {
      if (TT.world.pending) TT.decisions.resolve(0);
      TT.life.stepWorld();
      if (!TT.player().alive) { p.alive = true; }
    }
  } finally { TT.news = origNews; }
  line('info', '   sau 300 năm: ' + leaves + ' lần có người rời vùng, ' + arrivals + ' lần có khách lạ tới');
  ok(leaves > 0 && arrivals > 0, 'phải có cả người rời đi lẫn khách tới');
});

test('Mô phỏng 100 năm tự chọn mặc định không lỗi', () => {
  TT.life.createWorld(7);
  const n = TT.life.simulate(Y100, true);
  eq(n, Y100);
  const rid = TT.player().region;
  ok(coreIn(rid).length >= TT.config.coreMin - 3, 'dân số NPC lõi ' + coreIn(rid).length);
});

test('Mô phỏng lặp lại được (cùng hạt giống cho cùng kết quả)', () => {
  TT.life.createWorld(99); TT.life.simulate(600, true); const a = fingerprint();
  TT.life.createWorld(99); TT.life.simulate(600, true); const b = fingerprint();
  eq(a, b);
});

test('Lưu/tải: chạy tiếp sau khi tải cho cùng kết quả (kể cả vùng đã dựng và đang vượt vùng)', () => {
  TT.life.createWorld(123);
  const p = moveTo('trung_chau'); p.realm = 5; p.hp = S.hpMax(p);
  TT.cross.start(p, 'tu_than:dong_hai');
  TT.life.simulate(240, true);
  const snap = TT.save.snapshot();
  TT.life.simulate(2000, true); const direct = fingerprint();
  TT.save.restore(snap);
  TT.life.simulate(2000, true); const reloaded = fingerprint();
  eq(reloaded, direct);
});

test('Quyết định đột phá và đầu thai xuất hiện và giải quyết được', () => {
  TT.life.createWorld(2024);
  const seen = {};
  for (let i = 0; i < 6000; i++) {
    if (TT.world.pending) { seen[TT.world.pending.type] = (seen[TT.world.pending.type] || 0) + 1; TT.decisions.resolve(0); if (TT.world.pending) TT.decisions.resolveDefault(); }
    TT.life.stepWorld();
  }
  line('info', '   quyết định đã gặp: ' + JSON.stringify(seen));
  return !!(seen.breakthrough || seen.death || seen.ascend);
});

// ================= M1: sự kiện, kỳ ngộ, tầng quyết định, quy tắc nếu-thì =================
function freshPlayer(seed, opts) {
  TT.life.createWorld(seed || 3);
  const p = TT.player();
  Object.assign(p, { realm: 2, gold: 500, hp: 100, xp: 0, direction: 'can_bang', pathAsked: true }, opts || {});
  p.hp = S.hpMax(p);
  TT.world.pending = null; TT.world.settings.auto = 'can_bang';
  return p;
}

// Nhân vật giống người chơi nhưng rẻ (không dựng lại thế giới), dùng cho các vòng lặp lớn.
function mkChar(opts) {
  const c = TT.createChar({ kind: 'player', age: 20 });
  Object.assign(c, { realm: 2, gold: 500, direction: 'can_bang' }, opts || {});
  c.hp = S.hpMax(c);
  return c;
}

test('Sự kiện: dữ liệu hợp lệ, mọi lựa chọn chạy được và trả về kết quả', () => {
  TT.life.createWorld(3);
  const ids = {}, kinds = ['risk', 'safe', 'fight', 'flee', 'help', 'pay'];
  ok(D.EVENTS.length >= 30, 'số sự kiện ' + D.EVENTS.length);
  let nChoice = 0;
  D.EVENTS.forEach(e => {
    ok(!ids[e.id], 'trùng id ' + e.id); ids[e.id] = 1;
    if (e.manual) return; // sự kiện thủ công cần ngữ cảnh, kiểm ở bài khác
    ok(e.tier >= 1 && e.tier <= 3, e.id + ' tier');
    ok(e.title && e.text && e.choices.length >= 1, e.id + ' thiếu nội dung');
    e.choices.forEach(ch => {
      ok(ch.key && ch.label && kinds.indexOf(ch.kind) >= 0, e.id + '/' + ch.key + ' thiếu key/label/kind');
      for (let k = 0; k < 40; k++) {
        const c = mkChar({ realm: k % 4, gold: 200 });
        c.known.kv = c.known.luck = false;
        if (e.places) { const pl = TT.map.placesOf(c.region).find(p => e.places.indexOf(p.type) >= 0); if (pl) c.place = pl.id; }
        if (e.id.indexOf('sect_') === 0) { // sự kiện của thành viên tông môn
          c.region = 'trung_chau'; c.place = 'tc_thanh_van'; c.tuchat = { total: 50, attrs: [{ n: 'Thổ', di: false, p: 50 }] };
          TT.sect.join(c, 'tc_thanh_van'); if (e.id === 'sect_chuong_mon_viec') c.sect.rank = 4;
        }
        let ctx = {};
        if (e.setup) { ctx = e.setup(c); if (!ctx) continue; }
        if (typeof e.text === 'function') ok(String(e.text(c, ctx)).length > 10, e.id + ' nội dung rỗng');
        const r = ch.run(c, ctx);
        const res = typeof r === 'string' ? { t: r } : r;
        ok(res && typeof res.t === 'string' && res.t.length > 3, e.id + '/' + ch.key + ' kết quả rỗng');
        ok(isFinite(c.hp) && isFinite(c.gold) && isFinite(c.xp) && c.gold >= 0, e.id + '/' + ch.key + ' số liệu hỏng');
      }
      nChoice++;
    });
  });
  line('info', '   ' + D.EVENTS.length + ' sự kiện (' + [1, 2, 3].map(t => 'tầng ' + t + ': ' + D.EVENTS.filter(e => e.tier === t).length).join(', ') + '), ' + nChoice + ' lựa chọn');
});

test('Kỳ ngộ: mỗi sự kiện kỳ ngộ cho 5-15% đổi vận, đủ các loại kết quả', () => {
  TT.life.createWorld(7);
  const n = 6000, got = {};
  let hit = 0;
  for (let i = 0; i < n; i++) {
    const c = mkChar({ realm: 1 });
    c.baseKv = 5; c.traitIds = ['xui_xeo', 'than_cuong']; c.known.kv = c.known.luck = false;
    const before = JSON.stringify([c.tuchat, c.traitIds, c.baseKv, c.known, c.inv]);
    const r = TT.ev.kyNgo(c, 0.1);
    if (r) {
      hit++; ok(/Kỳ ngộ/.test(r.t) && r.cls === 'big', 'định dạng kỳ ngộ');
      ok(JSON.stringify([c.tuchat, c.traitIds, c.baseKv, c.known, c.inv]) !== before, 'kỳ ngộ không đổi gì: ' + r.t);
      const k = /tư chất hệ/.test(r.t) ? 'tư chất' : /biến dị/.test(r.t) ? 'biến dị' : /Nghiệp chướng/.test(r.t) ? 'xóa xấu' : /tiên thiên/.test(r.t) ? 'tiên thiên tốt' : /Khí vận/.test(r.t) ? 'khí vận' : 'lộ chỉ số';
      got[k] = (got[k] || 0) + 1;
    }
  }
  const rate = hit / n;
  line('info', '   tỉ lệ kỳ ngộ ' + (rate * 100).toFixed(1) + '%: ' + JSON.stringify(got));
  ok(rate > 0.05 && rate < 0.15, 'tỉ lệ ' + rate);
  ok(Object.keys(got).length >= 6, 'thiếu loại kết quả: ' + Object.keys(got).join(','));
});

test('Tầng quyết định: tầng 2 đếm ngược rồi chọn mặc định, tầng 3 dừng hẳn, mức tự động dịch chuyển tầng', () => {
  const p = freshPlayer(11, { realm: 1 });
  const t2 = D.eventById.thieu_chu, t3 = D.eventById.nhan_la, t1 = D.eventById.thue_kho;
  p.ring = false; p.flags = {};
  // Cân bằng
  TT.events.fire(p, t2);
  let d = TT.world.pending;
  ok(d && d.type === 'event' && d.tier === 2 && d.timeout > 0, 'tầng 2 phải có đếm ngược');
  ok(d.choices.length === 2 && d.def >= 0, 'phải có lựa chọn mặc định');
  TT.decisions.resolveDefault(); ok(!TT.world.pending, 'hết giờ phải chọn mặc định');
  TT.events.fire(p, t3); d = TT.world.pending;
  ok(d && d.tier === 3 && !d.timeout, 'tầng 3 dừng hẳn'); TT.decisions.resolveDefault();
  const logs0 = p.log.length;
  TT.events.fire(p, t1);
  ok(!TT.world.pending && p.log.length > logs0, 'tầng 1 tự chạy và ghi nhật ký');
  // Tự động: tầng 2 tự chọn, tầng 3 vẫn dừng
  TT.decisions.setMode('tu_dong');
  p.evCool = {};
  TT.events.fire(p, t2); ok(!TT.world.pending, 'tự động: tầng 2 tự chọn');
  p.flags = {}; p.ring = false;
  TT.events.fire(p, t3); ok(TT.world.pending && TT.world.pending.tier === 3, 'tự động: tầng 3 vẫn dừng');
  TT.decisions.resolveDefault();
  // Thủ công: tầng 2 thành tầng 3 (không đếm ngược)
  TT.decisions.setMode('thu_cong');
  TT.events.fire(p, t2); d = TT.world.pending;
  ok(d && d.tier === 3 && !d.timeout, 'thủ công: tầng 2 thành dừng hẳn'); TT.decisions.resolveDefault();
  // Đột phá ở chế độ tự động tự xử lý, ở chế độ khác dừng chờ
  TT.decisions.setMode('tu_dong');
  p.xp = D.NEED[p.realm] + 1; p.fortune = 99; p.gold = 50;
  TT.decisions.breakthroughFor(p);
  ok(!TT.world.pending || TT.world.pending.type !== 'breakthrough', 'tự động: đột phá tự quyết');
  TT.decisions.setMode('can_bang');
  const q = freshPlayer(12, { realm: 1 }); q.xp = D.NEED[1] + 1; q.fortune = 99;
  TT.decisions.breakthroughFor(q);
  ok(TT.world.pending && TT.world.pending.type === 'breakthrough' && TT.world.pending.tier === 3, 'cân bằng: đột phá dừng chờ');
});

test('Quy tắc nếu-thì: ép hành động theo sinh lực/vàng/bình cảnh và chọn lựa chọn sự kiện', () => {
  const p = freshPlayer(21, { realm: 1, direction: 'phieu_luu' });
  p.rules = TT.rules.defaults();
  p.hp = S.hpMax(p) * 0.2;
  for (let i = 0; i < 30; i++) eq(TT.ai.choose(p), 'rest', 'sinh lực thấp phải nghỉ');
  p.hp = S.hpMax(p); p.rules.goldBelow = { on: true, v: 100 }; p.gold = 10;
  for (let i = 0; i < 30; i++) eq(TT.ai.choose(p), 'work', 'thiếu vàng phải đi kiếm sống');
  p.gold = 500; p.stuck = true; p.rules.stuck = { on: true, v: 'seek' };
  for (let i = 0; i < 30; i++) eq(TT.ai.choose(p), 'seek', 'kẹt bình cảnh phải tìm cơ duyên');
  p.rules.stuck.on = false; p.stuck = false;
  const seen = {}; for (let i = 0; i < 300; i++) seen[TT.ai.choose(p)] = 1;
  ok(Object.keys(seen).length >= 3, 'tắt quy tắc thì hành động trở lại đa dạng');
  // quy tắc cho lựa chọn sự kiện
  const e = D.eventById.bi_canh_mo, riskIdx = 0, safeIdx = 1;
  p.hp = S.hpMax(p);
  p.rules.risk = { on: true, v: 'skip' };
  eq(TT.events.defaultIndex(p, e, e.choices.map(c => ({ key: c.key, kind: c.kind })), false), safeIdx, 'bỏ qua nguy hiểm');
  p.rules.risk = { on: true, v: 'try' };
  eq(TT.events.defaultIndex(p, e, e.choices.map(c => ({ key: c.key, kind: c.kind })), false), riskIdx, 'thử vận may');
  const f = D.eventById.yeu_thu;
  p.rules.threat = { on: true, v: 'flee' };
  eq(f.choices[TT.events.defaultIndex(p, f, f.choices.map(c => ({ key: c.key, kind: c.kind })), false)].key, 'chay', 'gặp yêu thú thì chạy');
  p.rules.threat = { on: true, v: 'fight' };
  eq(f.choices[TT.events.defaultIndex(p, f, f.choices.map(c => ({ key: c.key, kind: c.kind })), false)].kind, 'fight', 'gặp yêu thú thì đánh');
  // không có quy tắc: hướng phiêu lưu liều hơn hướng tu luyện
  p.rules.risk.on = false; p.rules.threat.on = false;
  p.direction = 'phieu_luu'; p.personality = 'lieu_linh';
  eq(TT.events.defaultIndex(p, e, e.choices.map(c => ({ key: c.key, kind: c.kind })), false), riskIdx, 'phiêu lưu thì liều');
  p.direction = 'tu_luyen'; p.personality = 'hien_hoa';
  eq(TT.events.defaultIndex(p, e, e.choices.map(c => ({ key: c.key, kind: c.kind })), false), safeIdx, 'tu luyện hiền hòa thì thận trọng');
});

test('Nhịp quyết định: đo số hộp chọn mỗi năm game của người chơi và thời gian chết dài nhất', () => {
  const names = ['tầng 2 (đếm ngược)', 'tầng 3 (dừng)'];
  const cnt = { t2: 0, t3: 0, byType: {} }; let years = 0, longestGap = 0, gap = 0;
  for (let s = 0; s < 12; s++) {
    TT.life.createWorld(500 + s);
    const p0 = TT.player();
    for (let m = 0; m < 12 * 80 && TT.player() === p0; m++) {
      if (TT.world.pending) {
        const d = TT.world.pending;
        if (d.tier === 2) cnt.t2++; else cnt.t3++;
        const k = d.type === 'event' ? d.evId : d.type; cnt.byType[k] = (cnt.byType[k] || 0) + 1;
        gap = 0; TT.decisions.resolveDefault();
      }
      TT.life.stepWorld(); gap++; if (gap > longestGap) longestGap = gap;
    }
    years += Math.floor((TT.world.months - TT.config.startYear * 12) / 12);
  }
  const perYear = (cnt.t2 + cnt.t3) / years;
  line('info', '   ' + years + ' năm game: ' + cnt.t2 + ' hộp tầng 2, ' + cnt.t3 + ' hộp tầng 3 => ' + (perYear * 12).toFixed(2) + ' lần hỏi mỗi phút ở tốc độ x1 (1 năm = 5 giây)');
  line('info', '   nhiều nhất: ' + Object.entries(cnt.byType).sort((a, b) => b[1] - a[1]).slice(0, 8).map(x => x[0] + ' ' + x[1]).join(', '));
  line('info', '   thời gian chết dài nhất: ' + longestGap + ' tháng game = ' + Math.round(longestGap / 12 * 5) + ' giây ở x1');
  ok(perYear * 12 > 1.5 && perYear * 12 < 6, 'nhịp hỏi ' + (perYear * 12).toFixed(2) + ' lần/phút ngoài khoảng 1.5-6');
});

test('Giao du: mọi kiểu tương tác chạy được, thiện cảm đổi hợp lý, NPC với NPC cũng giao du', () => {

    a.place = b.place = 'tc_vinh_do'; a.region = b.region = 'trung_chau';
    const r = TT.social.interact(a, b);

  TT.life.createWorld(43); TT.life.simulate(12 * 30, true);
  const w = TT.world; let pairs = 0, friends = 0, foes = 0;
  const npcRel = Object.keys(w.rel).filter(k => { const [x, y] = k.split(':').map(Number); return w.chars[x] && w.chars[y] && w.chars[x].kind === 'npc' && w.chars[y].kind === 'npc'; });

});

test('Kẻ thù báo thù: thề báo thù, đi tìm người chơi, có tin báo trước, rồi giáp mặt', () => {
  let got = null, tried = 0;
  for (let seed = 60; seed < 75 && !got; seed++) {
    TT.life.createWorld(seed); tried++;
    const p = TT.player(); p.realm = 1; p.autoMove = false; p.hp = S.hpMax(p);
    const cand = coreIn(p.region).filter(c => c.place !== p.place && !c.travel);
    if (!cand.length) continue;
    const E = cand[0]; E.realm = Math.max(E.realm, 2); E.hp = S.hpMax(E);
    TT.social.makeEnemy(E, p, 'thù thử nghiệm');
    ok(E.vows.indexOf(p.id) >= 0 && TT.rel.get(p, E).k === 'thu', 'phải ghi nhận thù');
    let warned = false, met = false;
    for (let m = 0; m < 80 && p.alive; m++) {
      const d = TT.world.pending;
      if (d) { if (d.type === 'event' && d.evId === 'rel_ke_thu') { met = true; break; } TT.decisions.resolveDefault(); }
      TT.life.stepWorld();
      if (TT.rumors.active().some(o => o.kind === 'ke_thu')) warned = true;
      if (!E.alive) break;
    }
    if (met) got = { warned, seed };
  }
  ok(got, 'kẻ thù không bao giờ tìm tới sau ' + tried + ' thế giới thử');
  ok(got.warned, 'phải có tin báo trước kẻ thù đang tới');
  line('info', '   kẻ thù tìm tới người chơi (hạt giống ' + got.seed + '), có tin báo trước');
});

    }
  }));

});

test('Nhiệm vụ: dựng ba tầng, độ khó hợp lý, nhận có giới hạn chỗ, hoàn thành được thưởng, hỏng/bỏ bị phạt theo người giao', () => {
  const Q = TT.quests, DQ = TT.data.QUEST;
  const p = freshPlayer(101, { realm: 0 }); p.xp = 0; p.direction = 'can_bang';
  primeQuests(p);
  ['s', 'm', 'l'].forEach(t => {
    let q = null; for (let i = 0; i < 20 && !q; i++) q = Q.make(p, t, 'self', ['xp', 'gold', 'explore', 'fame'][i % 4]);
    ok(q, 'dựng được nhiệm vụ tầng ' + t);

test('Thương hội: thế lực thứ tư, giàu và có ảnh hưởng nhưng không có quân đội, không tham chiến, tự cung có trần', () => {
  const F = TT.fac;
  TT.life.createWorld(151); let f = F.S(); let H = F.list('hoi');
  eq(H.length, 3, 'ba thương hội lớn'); H.forEach(x => { ok(x.reach.length >= 3 && x.reach.length <= 6, 'phủ 3-6 vùng: ' + x.reach.length); ok(x.guard <= D.HOI.guardMax && x.power <= D.HOI.powerMax, 'không có quân đội'); ok(x.own <= D.HOI.ownMax, 'tự cung có trần'); ok(D.HOI.agendaName[x.agenda], 'có xu hướng'); });
  ok(F.hoiCover(H[0].reach[0]) > 0, 'vùng có hội thì độ phủ dương'); const bare = D.REGIONS.map(r => r.id).find(r => F.hoiAt(r).length === 0); if (bare) eq(F.hoiCover(bare), 0, 'vùng không hội thì độ phủ 0');
  // mô phỏng dài: hội không bao giờ tham chiến, giữ trần, có sự kiện
  const orig = TT.life.stepChar; TT.life.stepChar = function (c) { if (c.kind !== 'player') return; return orig.apply(this, arguments); };
  let hoiEvents = 0, aliveMin = 9;
  try {
    for (let s = 0; s < 3; s++) {
      TT.life.createWorld(160 + s); TT.world.settings.auto = 'tu_dong'; const p0 = TT.player();
      for (let m = 0; m < 12 * 80 && TT.player() === p0; m++) {
        if (TT.world.pending) { if (TT.world.pending.type === 'death') break; TT.decisions.resolveDefault(); }
        TT.life.stepWorld();
        if (m % 12 === 0) { F.list('hoi').forEach(x => { ok(x.guard <= D.HOI.guardMax + 1e-9 && x.own <= D.HOI.ownMax + 1e-9 && x.wealth >= 0 && x.wealth <= 100 && x.reach.length >= 1 && x.reach.length <= D.HOI.reachMax, 'hội trong giới hạn'); ok(!x.war, 'hội không tham chiến'); }); }
      }
      F.wars().forEach(w => { ok(F.get(w.a).kind !== 'hoi' && F.get(w.b).kind !== 'hoi', 'chiến tranh không có hội'); });
      hoiEvents += F.S().chron.filter(e => /Thương Hội|Thanh Phong Hành|Hắc Kim Hội|chi nhánh|đầu cơ|môi giới/.test(e.t)).length; aliveMin = Math.min(aliveMin, F.list('hoi').filter(F.alive).length);
    }
  } finally { TT.life.stepChar = orig; }

test('Tin đồn và cơ hội có hạn: báo trước, nổ sự kiện khi có mặt, lỡ khi vắng, lập kế hoạch đi tới', () => {
  const p = freshPlayer(111, { realm: 1, gold: 200 }); p.autoMove = false;
  const w = TT.world, rid = p.region;
  const place = TT.map.placesOf(rid).find(x => x.id !== p.place);
  // 1. có mặt đúng lúc: sự kiện nổ
  const o = TT.rumors.add({ kind: 'cao_nhan', region: rid, place: place.id, open: w.months + 3, close: w.months + 8, name: 'Cao nhân ở ' + place.n, text: 'thử' });
  p.place = place.id; p.travel = null;
  let fired = null;
  for (let i = 0; i < 12 && !fired; i++) { TT.life.stepWorld(); const d = w.pending; if (d && d.type === 'event' && d.evId === 'opp_cao_nhan') fired = d; else if (d) TT.decisions.resolveDefault(); p.place = place.id; p.travel = null; }
  ok(fired, 'sự kiện cơ hội phải nổ khi có mặt'); ok(o.done, 'cơ hội đã dùng'); TT.world.pending = null;
  // 2. vắng mặt: lỡ
  const o2 = TT.rumors.add({ kind: 'dau_gia', region: rid, place: place.id, open: w.months + 1, close: w.months + 2, name: 'Đấu giá thử', text: 'thử' });
  p.place = TT.map.placesOf(rid).find(x => x.id !== place.id).id;
  for (let i = 0; i < 5; i++) { TT.life.stepWorld(); if (w.pending) TT.decisions.resolveDefault(); p.place = TT.map.placesOf(rid).find(x => x.id !== place.id).id; p.travel = null; }
  ok(o2.done, 'cơ hội hết hạn khi vắng mặt');
  // 3. kế hoạch
  p.place = TT.map.placesOf(rid)[0].id; p.travel = null; p.dest = null;
  const far = TT.map.placesOf(rid).find(x => TT.map.localRoute(p.place, x.id) && TT.map.localRoute(p.place, x.id).months >= 2);
  const o3 = TT.rumors.add({ kind: 'bi_canh', region: rid, place: far.id, open: w.months + 24, close: w.months + 30, name: 'Bí cảnh thử', text: 'thử' });
  TT.rumors.setPlan(p, o3); ok(p.plan === o3.id && (p.travel || p.dest === far.id), 'phải đi tới địa điểm cơ hội');
  // 4. sinh tin đồn tự nhiên
  let spawned = 0; for (let k = 0; k < 40; k++) { if (TT.rumors.spawn(p)) spawned++; w.opps.forEach(x => { x.done = true; }); }
  ok(spawned >= 30, 'sinh tin đồn tự nhiên ' + spawned);
  w.pending = null;
});

test('NPC tự kết đạo lữ, sinh con và nhận đồ đệ khi người chơi không can thiệp', () => {
  let pairs = 0, kids = 0, masters = 0, bornGrown = 0;
  for (let seed = 800; seed < 816; seed++) { // 16 thế giới: số con sinh ra ít nên cần mẫu đủ lớn để không phụ thuộc may rủi của dãy số ngẫu nhiên
    TT.life.createWorld(seed);
    TT.life.simulate(12 * 100, true);
    Object.values(TT.world.chars).forEach(c => {
      if (c.kind !== 'npc') return;
      if (TT.family.partners(c).length) pairs += 0.5;
      if (c.parents && c.parents.length) { kids++; if (TT.age(c) >= 12) bornGrown++; }
      if (c.master) masters++;
    });
  }
  line('info', '   sau 100 năm x6 thế giới: ' + Math.round(pairs) + ' cặp đạo lữ, ' + kids + ' NPC sinh ra trong thế giới (' + bornGrown + ' đã trưởng thành), ' + masters + ' đồ đệ');
  ok(pairs >= 2, 'NPC phải tự kết đạo lữ'); ok(kids >= 1, 'NPC phải có con');
});

function shopper(placeId, opts) {
  const c = mkChar(Object.assign({ realm: 1, gold: 2000 }, opts || {}));
  c.region = TT.map.place(placeId).region; c.place = placeId; c.travel = null; c.cross = null;

// Chạy một chuyến thám hiểm bằng lựa chọn mặc định (theo hướng đi, tính cách và quy tắc). Trả về cách kết thúc.
function runDungeon(c, kind) {
  const orig = TT.dungeon.finish; let how = null;
  TT.dungeon.finish = function (cc, h) { how = h; return orig.apply(this, arguments); };
  try {
    TT.world.pending = null; c.dgCool = 0; c.hp = S.hpMax(c); c.alive = true;
    TT.dungeon.enter(c, c.place, kind);
    for (let g = 0; g < 30 && c.dungeon && c.alive; g++) { if (!TT.world.pending) break; TT.decisions.resolveDefault(); }
    if (!c.alive) how = 'chet';
  } finally { TT.dungeon.finish = orig; }
  TT.world.pending = null;
  return how || (c.dungeon ? 'treo' : '?');
}
function dungeonHero(placeId) {
  const c = shopper(placeId, { realm: 2, gold: 100 }); c.tuchat = { total: 90, attrs: [{ n: 'Kim', di: false, p: 55 }, { n: 'Thủy', di: false, p: 35 }] };
  TT.items.add(c, 'kiem_tinh'); TT.items.equip(c, 'kiem_tinh'); TT.items.add(c, 'ao_da'); TT.items.equip(c, 'ao_da'); TT.items.add(c, 'ho_than_bua', 2); TT.items.add(c, 'hoi_xuan_dan', 3);
  c.techs = { han_thiet: { lv: 3, xp: 0 } }; c.techMain = 'han_thiet'; c.rules = TT.rules.defaults(); c.direction = 'can_bang'; c.personality = 'trung_lap'; c.hp = S.hpMax(c);
  return c;
}

// Đo cân bằng ít nhiễu hơn bài "20 thế giới": dựng NPC lõi ở tuổi cố định, chia đều theo vùng (không phụ thuộc vùng người chơi sinh ra).
// Kết quả là tỉ lệ đạt Trúc Cơ trở lên theo mức tư chất ở những NPC còn sống ở tuổi đó.
function balanceStrat(perRegion, age, seed) {
  TT.life.createWorld(seed || 77);
  const bucket = t => (t <= 70 ? 'thap' : t <= 120 ? 'kha' : 'cao');
  const st = { thap: { n: 0, tc: 0 }, kha: { n: 0, tc: 0 }, cao: { n: 0, tc: 0 } };
  D.REGIONS.forEach(r => {
    for (let i = 0; i < perRegion; i++) {
      const c = TT.life.spawnNpc(age, r.id);
      if (!c) continue;
      const b = st[bucket(c.tuchat.total)]; b.n++; if (c.realm >= 2) b.tc++;
    }
  });
  const pc = k => st[k].n ? st[k].tc / st[k].n * 100 : 0;
  return { thap: pc('thap'), kha: pc('kha'), cao: pc('cao'), n: st.thap.n + st.kha.n + st.cao.n };
}
test('Cân bằng phân tầng: đạt Trúc Cơ trở lên theo tư chất (NPC lõi tuổi 70, chia đều 9 vùng)', () => {
  const r = balanceStrat(40, 70);
  line('info', '   n=' + r.n + ': thấp ' + r.thap.toFixed(1) + '%, khá ' + r.kha.toFixed(1) + '%, cao ' + r.cao.toFixed(1) + '% (mốc tham chiếu M1: ~2 / 5 / 15, nhiễu ±5)');

});

test('Cân bằng: 20 thế giới x 100 năm, cảnh giới NPC lõi theo mức tư chất và theo vùng', () => {
  const names = ['Phàm', 'LK', 'TC', 'KĐ', 'NA', 'HT', 'PT'];
  const bucket = t => (t <= 70 ? 'thấp (<=70)' : t <= 120 ? 'khá (71-120)' : 'cao (>120)');
  const stat = {}, byRegion = {}; let deaths = 0, ageSum = 0, all = 0;
  for (let s = 1; s <= 20; s++) {
    TT.life.createWorld(1000 + s);
    TT.life.simulate(Y100, true);
    const rid = TT.player().region;
    for (const id in TT.world.chars) {
      const c = TT.world.chars[id];
      if (c.kind !== 'npc' || c.tier !== 'core' || c.region !== rid || c.traveler || c.foreign) continue; // bỏ du hành giả (cảnh giới được gán sẵn)
      const b = bucket(c.tuchat.total);
      const o = stat[b] = stat[b] || { n: 0, r: [0, 0, 0, 0, 0, 0, 0] };
      o.n++; o.r[c.realm]++; all++;
      const g = byRegion[rid] = byRegion[rid] || { n: 0, tc: 0, dead: 0 };
      g.n++; if (c.realm >= 2) g.tc++;
      if (!c.alive && !c.ascended && !c.left) { deaths++; g.dead++; ageSum += Math.floor((c.deathMonth - c.birthMonth) / 12); }
    }
  }
  Object.keys(stat).sort().forEach(b => {
    const o = stat[b];
    line('info', '   tư chất ' + b + ' (' + o.n + ' người): ' + o.r.map((v, i) => names[i] + ' ' + Math.round(v / o.n * 100) + '%').join(', '));
  });
  Object.keys(byRegion).sort().forEach(r => {
    const g = byRegion[r];
    line('info', '   vùng ' + r + ' (' + g.n + ' người): đạt Trúc Cơ+ ' + Math.round(g.tc / g.n * 100) + '%, chết ' + Math.round(g.dead / g.n * 100) + '%');
  });
  line('info', '   NPC lõi đã chết: ' + deaths + '/' + all + ', tuổi chết trung bình: ' + (deaths ? Math.round(ageSum / deaths) : 0));
});

test('Kinh tế (E): giá theo cung cầu trong khoảng, hạn dùng cộng dồn và giảm giá trị, mua bán dồn, thương hội và thiện cảm, hai đường gia nhập, lưu/tải', () => {
  const E = D.ECO, near2 = (x, y, m) => ok(Math.abs(x - y) < 1e-6, m + ': ' + x + ' vs ' + y);

  const gap = E.groups.map(g => { const a = D.REGIONS.map(r => TT.eco.rel(r.id, g)); return Math.max.apply(null, a) / Math.min.apply(null, a); });

  const c = shopper('tc_vinh_do', { gold: 5000 }); const L = TT.items.life('hoi_xuan_dan'); eq(L, E.life.dan, 'đan dược hạn 18 tháng'); eq(TT.items.life('kiem_sat'), null, 'pháp khí không hỏng');

test('Mạng quan hệ nhiều chiều (S1): giá trị cũ giữ nguyên, đọc không đổi diễn biến thế giới, sổ ân oán, bậc quan hệ, ma trận, lưu/tải', () => {
  const K = D.DIPLO, dp = TT.diplo;
  // 1. Đọc không đổi diễn biến: cùng hạt giống, một bên liên tục gọi các hàm đọc (peek, level, matrix, of), bên kia không.
  const run = reader => {
    TT.life.createWorld(911); const f = TT.fac.S();
    for (let y = 0; y < 80; y++) {
      TT.world.months += 12; TT.fac.yearly();
      if (reader) { const M = dp.matrix(null); M.list.forEach(x => { dp.of(x); M.list.forEach(z => { if (x !== z) { dp.peek(x, z); dp.describe(x, z); dp.cua(x, z); } }); }); }
    }
    return JSON.stringify([f.rel, f.rel2, f.chron.length, f.wars.length, Object.keys(f.list).map(k => f.list[k].state + Math.round(f.list[k].power))]);
  };
  const quiet = run(false), loud = run(true);
  eq(loud, quiet, 'gọi hàm đọc làm đổi diễn biến thế giới');

  // 2. Thế giới mới: relV trùng thiện cảm đã lưu; tổng hợp đối xứng, hữu hạn, trong [-100, 100]
  TT.life.createWorld(911); const f = TT.fac.S(), W = TT.world;
  for (let y = 0; y < 60; y++) { W.months += 12; TT.fac.yearly(); }
  const L = TT.fac.list().filter(TT.fac.alive);
  Object.keys(f.rel).forEach(k => { const [ia, ib] = k.split('|'), a = TT.fac.get(ia), b = TT.fac.get(ib); if (!a || !b) return; ok(Math.abs(TT.fac.relV(a, b) - Math.max(-100, Math.min(100, f.rel[k] + K.w.dao * dp.daoBase(a, b)))) < 1e-9, 'relV khác thiện cảm cộng đạo thống ' + k); });
  L.forEach(a => L.forEach(b => { if (a === b) return; const t = dp.total(a, b); ok(isFinite(t) && t >= -100 && t <= 100, 'tổng hợp hợp lệ'); eq(t, dp.total(b, a), 'đối xứng'); }));
  eq(Object.keys(f.rel).length, Object.keys(f.rel).filter(k => { const [ia, ib] = k.split('|'); return ia < ib; }).length, 'khóa cặp luôn a < b');

  // 3. peek không khởi tạo cặp mới
  const x1 = L[0], y1 = L.find(z => z !== x1 && f.rel[dp.key(x1, z)] == null);
  if (y1) { const n0 = Object.keys(f.rel).length; const p = dp.peek(x1, y1); ok(p.fresh, 'cặp chưa hỏi là fresh'); eq(Object.keys(f.rel).length, n0, 'peek không tạo cặp'); eq(p.tinh, dp.tagBase(x1, y1)); }

  // 4. Sổ ân oán: chiến tranh ghi cho cả hai chiều xem; hòa nghị ghi tiếp
  const ta = TT.fac.list('tong').filter(TT.fac.alive), a = ta[0], b = ta[1];
  a.war = b.war = null; a.power = b.power = 60;
  const h0 = dp.history(a, b).length; TT.fac.startWar(a, b);
  ok(dp.history(a, b)[0].k === 'chien' && dp.history(b, a)[0].k === 'chien', 'chiến tranh vào sổ ở cả hai chiều');
  ok(dp.history(a, b)[0].t.indexOf(a.n) >= 0, 'lời ghi có tên bên khởi sự'); eq(dp.history(a, b).length, h0 + 1);
  ok(dp.isWar(a, b) && dp.level(a, b).war, 'đang đánh nhau');
  const war = TT.fac.S().wars.find(w => w.a === a.id && w.b === b.id); TT.fac.endWar(war, 'draw');
  eq(dp.history(a, b)[0].k, 'hoa_nghi', 'hòa nghị ghi sau cùng'); ok(!dp.isWar(a, b));

  // 5. Sổ đầy: bỏ mục thường cũ trước, giữ thù truyền đời
  for (let i = 0; i < 3; i++) dp.log(a, b, 'diet', 0, 'bị diệt lần ' + i);
  for (let i = 0; i < 40; i++) dp.log(a, b, 'xung_dot', -5, 'xung đột ' + i);
  const hh = dp.history(a, b); eq(hh.length, K.logMax, 'sổ đầy đúng giới hạn'); eq(hh.filter(e => e.heir).length, 3, 'giữ thù truyền đời'); eq(hh[0].t, 'xung đột 39', 'mục mới nhất ở trên');
  for (let i = 0; i < 30; i++) dp.log(a, b, 'diet', 0, 'thêm ' + i); eq(dp.history(a, b).length, K.logMax, 'toàn mục truyền đời vẫn bị cắt đúng giới hạn');

  // 6. Tín nhiệm giảm khi bất tuân, đoạn tuyệt và kẹp 0..100
  const t0 = dp.peek(a, b).tin; dp.log(a, b, 'bat_tuan', 0, 'bất tuân'); ok(dp.peek(a, b).tin < t0, 'bất tuân hạ tín nhiệm');
  for (let i = 0; i < 20; i++) dp.log(a, b, 'doan_tuyet', 0, 'đoạn tuyệt'); eq(dp.peek(a, b).tin, 0, 'tín nhiệm kẹp 0');
  for (let i = 0; i < 40; i++) dp.log(a, b, 'hoa_nghi', 0, 'hòa'); eq(dp.peek(a, b).tin, 100, 'tín nhiệm kẹp 100');

  // 7. Bậc quan hệ theo ngưỡng; đồng minh và chiến tranh ghi đè nhãn
  const ra = TT.fac.list('trieu').filter(TT.fac.alive)[0], rb = TT.fac.list('trieu').filter(TT.fac.alive)[1], k7 = dp.key(ra, rb); ra.ally = []; rb.ally = []; // hai triều: không có đạo thống nền
  const lv = v => { f.rel[k7] = v; return dp.level(ra, rb); };
  eq(lv(80).id, 'than_huu'); eq(lv(20).id, 'hoa_hao'); eq(lv(0).id, 'trung_lap'); eq(lv(-20).id, 'lanh_nhat'); eq(lv(-40).id, 'bat_hoa'); eq(lv(-70).id, 'thu_dich'); eq(lv(-95).id, 'tu_thu');
  ra.ally = [rb.id]; rb.ally = [ra.id]; eq(lv(50).id, 'dong_minh', 'có minh ước thì là đồng minh'); ra.ally = []; rb.ally = [];
  ok(dp.describe(a, b).length > 3, 'có mô tả');

  // 8. Ma trận: lọc loại, kích thước, đường chéo rỗng, ô đối xứng
  const M = dp.matrix(['trieu', 'tong']), alive = TT.fac.list('trieu').concat(TT.fac.list('tong')).filter(TT.fac.alive).length; eq(M.list.length, alive, 'mọi thế lực còn sống'); eq(M.cells.length, alive);
  M.cells.forEach((row, i) => row.forEach((c, j) => { if (i === j) eq(c, null, 'đường chéo'); else eq(c.total, M.cells[j][i].total, 'ô đối xứng'); }));
  eq(dp.matrix(['trieu']).list.length, 9); ok(dp.matrix(null).list.length >= 20, 'tất cả thế lực');
  const O = dp.of(a); ok(Array.isArray(O.friends) && Array.isArray(O.foes) && Array.isArray(O.lords), 'hồ sơ thế lực đủ trường');

  // 9. Thêm chiều khác 'tinh': kẹp và ghi sổ; 'tinh' đi qua relAdd
  dp.add(a, b, 'loi', 500); eq(dp.peek(a, b).loi, 100); dp.add(a, b, 'loi', -500, ['tich_thu', 'thử']); eq(dp.peek(a, b).loi, -100); eq(dp.history(a, b)[0].k, 'tich_thu');
  const k = dp.key(a, b); f.rel[k] = 10; dp.add(a, b, 'tinh', 5); eq(f.rel[k], 15, 'tinh đi qua relAdd');
  eq(K.w.loi, 0, 'S1 chưa tính lợi ích vào tổng hợp'); ok(Math.abs(dp.total(a, b) - (15 + K.w.dao * dp.daoBase(a, b))) < 1e-9, 'tổng hợp = thiện cảm + đạo thống');

  // 10. Lưu/tải giữ nguyên sổ; bản lưu cũ không có rel2 vẫn dùng được
  const j0 = JSON.stringify(f.rel2), snap = TT.save.snapshot(); TT.save.restore(snap);
  eq(JSON.stringify(TT.fac.S().rel2), j0, 'rel2 giữ nguyên sau lưu/tải');
  delete TT.fac.S().rel2; const f2 = TT.fac.S(); ok(f2.rel2 && typeof f2.rel2 === 'object', 'bản cũ tự tạo rel2'); eq(dp.history(a, b).length, 0, 'bản cũ bắt đầu sổ từ lúc tải');
  dp.log(a, b, 'chien', -25, 'thử sau khi nâng cấp'); eq(dp.history(a, b).length, 1);

test('Quân lực (S6a): đọc không đổi thế giới, bảng lính tương đương, sát khí và trận có điều kiện, tướng tu sĩ, strength không đếm đôi, công tắc tắt, lưu/tải, bản cũ, giao diện chữ không số, hiệu năng', () => {
  const A = TT.army, K = D.ARMY, trieu = () => TT.fac.list('trieu');
  // 1. Hàm đọc không gọi rng và không khởi tạo nat
  TT.life.createWorld(911); const st0 = TT.rng.getState();
  trieu().forEach(x => { A.peek(x); A.soldiers(x, false); A.phOf(x); A.tuongRank(x, true); A.stateOf(x); A.mul(x); A.describe(x); A.trait(x.region); });
  A.vsCultivator(A.stateOf(trieu()[0]).arm, 3); A.sig();
  eq(TT.rng.getState(), st0, 'hàm đọc không gọi rng'); ok(!TT.world.fac.nat, 'hàm đọc không khởi tạo nat');
  eq(A.peek(trieu()[0]).sat, 0, 'chưa có bản ghi thì mặc định');
  // 2. Bảng lính tương đương (hàm thuần)
  const arm = o => Object.assign({ q: 0, ph: 1, tr: 0, sat: 0, qv: 55, tiep: 1, tuong: 0 }, o);
  const squad = arm({ q: 50, ph: 1.3, tuong: 1 });
  ok(A.vsCultivator(squad, 1).win, 'một đội lính tinh thắng Luyện Khí');
  ok(A.vsCultivator(squad, 2).win, 'một đội lính tinh có tướng thắng Trúc Cơ');
  eq(A.vsCultivator(arm({ q: 50, ph: 1.3 }), 2).why, 'thiếu tướng', 'Trúc Cơ cần tướng');
  const big = arm({ q: 90000, ph: 1.3, tr: 1, sat: 40, qv: 60, tiep: 1, tuong: 1 });
  ok(A.vsCultivator(big, 3).win, 'Kim Đan bị đại quân có trận vây thì thua');
  eq(A.vsCultivator(arm({ q: 90000, ph: 1.3, tuong: 1, qv: 60 }), 3).why, 'thiếu quân trận', 'Kim Đan không thua đại quân không trận');
  ok(!A.vsCultivator(arm({ q: 5000, ph: 1 }), 5).win, 'Hóa Thần thắng đại quân nhỏ');
  ok(!A.vsCultivator(big, 5).win, 'Hóa Thần thắng đại quân có trận mà chiến lực chưa đủ');
  ok(A.vsCultivator(arm({ q: 90000, ph: 1.6, tr: 3, sat: 100, qv: 100, tiep: 1, tuong: 3 }), 5).win, 'Hóa Thần thua đại quân có trận và sát khí cao');
  ok(!A.vsCultivator(arm({ q: 1e9, ph: 1.6, tr: 3, sat: 100, qv: 100, tiep: 1, tuong: 3 }), 6).win, 'Phi Thăng: phàm quân không thắng');
  // 3. Chạy thế giới: giá trị trong khoảng, đọc không đổi diễn biến, trận được học ở một số triều
  const run = reader => {
    TT.life.createWorld(77);
    for (let y = 0; y < 80; y++) { TT.world.months += 12; TT.fac.yearly(); if (reader) trieu().forEach(x => { A.describe(x); A.mul(x); A.stateOf(x); TT.nation.describe(x); }); }
    const f = TT.fac.S(); return JSON.stringify([f.nat, f.rel, f.chron.length, Object.keys(f.list).map(k => f.list[k].state + Math.round(f.list[k].power))]);
  };
  eq(run(true), run(false), 'gọi hàm đọc làm đổi diễn biến thế giới');
  let maxTr = 0, satSum = 0, satN = 0, withTran = 0;
  [101, 102, 103].forEach(seed => {
    TT.life.createWorld(seed);
    for (let y = 0; y < 300; y++) {
      TT.world.months += 12; TT.fac.yearly();
      const S0 = TT.fac.S().nat;
      trieu().forEach(x => {
        const e = S0[x.id]; ok(e && e.army, 'mỗi triều có bản quân lực sau một năm');
        ok(e.army.sat >= 0 && e.army.sat <= 100, 'sát khí trong [0,100]: ' + e.army.sat);
        ok(e.army.tr >= 0 && e.army.tr <= 3 && e.army.trN >= 0, 'trận trong [0,3]');
        ok(typeof e.army.tuongTu === 'boolean');
        maxTr = Math.max(maxTr, e.army.tr); satSum += e.army.sat; satN++;
        const m = A.mul(x); ok(m >= 0.4 && m <= 1.6, 'hệ số quân trong [0,4;1,6]: ' + m);
      });
      withTran += trieu().filter(x => S0[x.id].army.tr > 0).length;
    }
  });
  ok(maxTr >= 1, 'có triều học được quân trận');
  ok(satSum / satN > 1 && satSum / satN < 60, 'sát khí trung bình hợp lý: ' + (satSum / satN).toFixed(1));
  // 4. Sức mạnh không đếm đôi: strength dùng (power - phần quốc vận) x hệ số quân
  TT.life.createWorld(911); for (let y = 0; y < 30; y++) { TT.world.months += 12; TT.fac.yearly(); }
  const x = trieu()[0];
  const exp = (x.power - TT.nation.powerShift(x)) * (0.55 + 0.45 * x.unity / 100) * (0.8 + 0.4 * x.wealth / 100) * TT.pop.milMul(x) * TT.sectmod.milMul(x) * A.mul(x);
  ok(Math.abs(TT.fac.strength(x, []) - exp) < 1e-9, 'strength của triều có quân lực');
  const tg = TT.fac.list('tong')[0]; eq(TT.fac.strength(tg, []), tg.power * (0.55 + 0.45 * tg.unity / 100) * (0.8 + 0.4 * tg.wealth / 100) * TT.pop.milMul(tg) * TT.sectmod.milMul(tg), 'tông không đổi');
  // 5. Công tắc tắt: strength như trước S6a, không ghi gì
  K.on = false;
  const old = x.power * (0.55 + 0.45 * x.unity / 100) * (0.8 + 0.4 * x.wealth / 100) * TT.pop.milMul(x) * TT.sectmod.milMul(x);
  eq(TT.fac.strength(x, []), old, 'tắt: strength như cũ');
  TT.life.createWorld(913); for (let y = 0; y < 60; y++) { TT.world.months += 12; TT.fac.yearly(); }
  ok(Object.keys(TT.fac.S().nat || {}).every(k => !TT.fac.S().nat[k].army), 'tắt: không tạo bản quân lực');
  K.on = true;
  // 6. Lưu/tải giữ quân lực; bản cũ không có quân lực vẫn chạy
  TT.life.createWorld(102); for (let y = 0; y < 50; y++) { TT.world.months += 12; TT.fac.yearly(); }
  const before = JSON.stringify(TT.fac.S().nat), snap = TT.save.snapshot();
  TT.life.createWorld(5); TT.save.restore(snap);
  eq(JSON.stringify(TT.fac.S().nat), before, 'lưu/tải giữ quân lực');
  Object.keys(TT.fac.S().nat).forEach(k => { delete TT.fac.S().nat[k].army; });
  for (let y = 0; y < 20; y++) { TT.world.months += 12; TT.fac.yearly(); }
  ok(trieu().every(t => TT.fac.S().nat[t.id].army), 'bản cũ: quân lực được khởi tạo muộn');
  // 7. Giao diện: dòng quân lực trong thẻ triều (chữ, không số)
  const ui = TT.ui; if (ui && ui.buildNation) {
    ui.nationSel.open = true; const keep = JSON.stringify(TT.fac.S().nat); const box = document.createElement('div'); ui.buildNation(box, TT.player()); ui.nationSel.open = false;
    const lines = [...box.querySelectorAll('.small')].filter(d => /Quân lực/.test(d.textContent));
    eq(lines.length, 9, 'chín thẻ có dòng quân lực'); ok(lines.every(d => !/\d/.test(d.textContent)), 'dòng quân lực không có số');
    ok(lines.every(d => /tướng/.test(d.textContent) && /trận/.test(d.textContent)), 'dòng có tướng và trận');
    eq(JSON.stringify(TT.fac.S().nat), keep, 'giao diện chỉ đọc');
  }
  // chữ của game không nhắc tên nước thật; hiệu năng
  const txt = JSON.stringify([K.ph, K.bac, K.tuongName, K.tran, K.satWord, Object.keys(K.trait).map(r => K.trait[r].n + K.trait[r].desc)]);
  ['Trung Quốc', 'Nhật Bản', 'Mỹ', 'Nga', 'Đức', 'Ấn Độ', 'Mông Cổ', 'Iran', 'Venice', 'La Mã', 'Hà Lan', 'Ottoman', 'Viking', 'Khmer'].forEach(w => ok(txt.indexOf(w) < 0, 'chữ game không nhắc tên nước thật: ' + w));
  TT.life.createWorld(5); const t1 = performance.now(); for (let y = 0; y < 300; y++) { TT.world.months += 12; TT.fac.yearly(); } const ms = performance.now() - t1; ok(ms < 1000, '300 năm mất ' + Math.round(ms) + ' ms');
  line('info', '   300 năm có quân lực: ' + Math.round(ms) + ' ms; sát khí trung bình ' + (satSum / satN).toFixed(1) + '; trận cao nhất ' + maxTr);
});

test('Tông môn có trạng thái riêng theo thế giới (S4): đọc không đổi thế giới, hai thế giới độc lập, sức mạnh suy từ chỉ số, chính sách có trần, thanh trừng có hậu quả và cách quãng, công tắc tắt, đạo thống, giao diện, lưu/tải, bản cũ', () => {
  const K = D.SECT_MOD, M = TT.sectmod, tongs = () => TT.fac.list('tong'), HM = 'hm_nhat_luan', h0 = D.SECTS[HM].nhan, ON = 5;
  // 1. Đọc không gọi rng và không khởi tạo sx
  TT.life.createWorld(911); const wA = TT.world, st0 = TT.rng.getState();
  tongs().forEach(x => { M.view(x.id); M.peek(x.id); M.powerShift(x); M.unityMul(x); M.wealthTrend(x); M.milMul(x); M.warMul(x); M.allyCut(x); M.recruitMul(x.id); TT.diplo.daoBase(x, tongs()[0]); });
  eq(TT.rng.getState(), st0, 'hàm đọc không gọi rng'); ok(!wA.fac.sx, 'hàm đọc không khởi tạo sx');
  eq(M.view(HM).nhan, h0, 'chưa có bản ghi thì đọc giá trị khởi đầu'); eq(M.view(HM).init, false);
  // 2. Hai thế giới độc lập; nhãn đọc theo thế giới đang chạy, dữ liệu chung không đổi
  M.S(HM).nhan = 40; eq(D.SECTS[HM].align, 'chinh', 'nhãn theo thế giới đang chạy'); M.S(HM).nhan = -50; eq(D.SECTS[HM].align, 'ta');
  eq(D.SECTS[HM].nhan, h0, 'dữ liệu chung không đổi khi thế giới đổi');
  TT.life.createWorld(912); const wB = TT.world; eq(D.SECTS[HM].align, 'trung', 'thế giới mới: nhãn khởi đầu (sx=' + JSON.stringify(TT.world.fac.sx && TT.world.fac.sx[HM]) + ', seed=' + TT.world.seed + ', static=' + D.SECTS[HM].nhan + ')'); eq(M.view(HM).nhan, h0, 'thế giới mới: giá trị khởi đầu');
  M.S(HM).gt[0] = 99; ok(wA.fac.sx[HM].nhan === -50 && wA.fac.sx[HM].gt[0] !== 99 && wB.fac.sx[HM].gt[0] === 99, 'hai thế giới không ảnh hưởng nhau');
  // 3. Đọc không đổi diễn biến (cùng hạt giống, có đọc và không đọc)
  const run = reader => { TT.life.createWorld(78); for (let y = 0; y < 80; y++) { TT.world.months += 12; TT.fac.yearly(); if (reader) tongs().forEach(x => { M.view(x.id); M.powerShift(x); M.milMul(x); M.unityMul(x); M.recruitMul(x.id); }); } const f = TT.fac.S(); return JSON.stringify([f.sx, f.rel, f.chron.length, Object.keys(f.list).map(k => f.list[k].state + Math.round(f.list[k].power))]); };
  eq(run(true), run(false), 'gọi hàm đọc làm đổi diễn biến thế giới');
  // 4. Sức mạnh suy từ bảy chỉ số: bình quân quanh 0, tăng theo chỉ số, công tắc tắt thì 0
  TT.life.createWorld(913); const tg = tongs(), avg0 = tg.reduce((a, x) => a + M.powerShift(x), 0) / tg.length;
  ok(Math.abs(avg0) < 0.6, 'độ lệch sức mạnh bình quân gần 0: ' + avg0.toFixed(2));
  const tc = TT.fac.get('tc_thanh_van'), sTc = M.S(tc.id); sTc.chiso = sTc.chiso.map(() => 100); const hi = M.powerShift(tc); sTc.chiso = sTc.chiso.map(() => 0); ok(hi > 30 && M.powerShift(tc) < -40, 'chỉ số cao đẩy sức mạnh lên, thấp kéo xuống');
  K.on = false; eq(M.powerShift(tc), 0); K.on = true;
  // 5. Năm chính sách có trần: mọi lựa chọn nằm trong khoảng
  let bad = 0;
  tg.forEach(x => { const s = M.S(x.id), orig = s.chinhsach.slice(); D.SECT_POLICY.keys.forEach((k, i) => Object.keys(D.SECT_POLICY.opt[k]).forEach(o => {
    s.chinhsach[i] = o; const inR = (v, a, b) => v >= a && v <= b;
    if (!inR(M.milMul(x), K.cap.mil[0], K.cap.mil[1]) || !inR(M.warMul(x), K.cap.mul[0], K.cap.mul[1]) || !inR(M.unityMul(x), K.cap.mul[0], K.cap.mul[1]) || !inR(M.recruitMul(x.id), K.cap.mul[0], K.cap.mul[1])) bad++;
    if (!inR(M.allyCut(x), -K.cap.ally, K.cap.ally) || !inR(M.wealthTrend(x), -K.cap.drift, K.cap.drift)) bad++;
  })); s.chinhsach = orig; });
  eq(bad, 0, 'mọi chính sách nằm trong trần');
  // 6. Thanh trừng: đúng hậu quả, sử ký, sổ ân oán, nhãn theo hành vi mới; không lặp lại trong 80 năm
  TT.life.createWorld(914); const x = TT.fac.get('ts_kim_phong'), yn = 100; TT.world.months += 12 * yn;
  const s0 = JSON.parse(JSON.stringify(M.S(x.id))), u0 = x.unity, pw0 = x.power, c0 = TT.fac.S().chron.length;
  M.purge(x, M.S(x.id), yn); const s1 = M.S(x.id);
  ok(s0.nhan - s1.nhan >= K.purge.nhanCut[0] && s0.nhan - s1.nhan <= K.purge.nhanCut[1], 'hành vi tàn nhẫn thêm trong khoảng');
  eq(s1.gt[0], Math.min(100, s0.gt[0] + K.purge.gtTu), 'trật tự tăng'); eq(s1.chinhsach[0], 'tap_quyen', 'thể chế tập quyền'); eq(s1.last, yn, 'ghi năm thanh trừng');
  ok(x.unity < u0 && x.power < pw0, 'đoàn kết và sức mạnh giảm'); eq(x.tag, D.SECTS.ts_kim_phong.align, 'nhãn của tông (tag) theo hành vi mới');
  ok(TT.fac.S().chron.slice(c0).some(e => /thanh trừng/.test(e.t)), 'ghi sử ký và tin');
  const R2 = TT.fac.S().rel2 || {}; ok(Object.keys(R2).some(k => (R2[k].an || []).some(e => e.k === 'thanh_trung')), 'ghi vào sổ ân oán');
  s1.chiso[ON] = 0; let due = false; for (let y = yn + 1; y < yn + 80; y++) if (M.purgeDue(x, s1, y)) due = true; eq(due, false, 'chưa đủ 80 năm thì không thanh trừng lại');
  // 7. Tự xảy ra: hiếm, cách quãng ít nhất 80 năm cho mỗi tông (6 hạt giống x 300 năm)
  let purges = 0, gapBad = 0; const pg = M.purge;
  [101, 102, 103, 104, 105, 106].forEach(seed => { TT.life.createWorld(seed); const last = {}; M.purge = function (t, s, y) { if (last[t.id] != null && y - last[t.id] < 80) gapBad++; last[t.id] = y; purges++; return pg.apply(this, arguments); };
    for (let y = 0; y < 300; y++) { TT.world.months += 12; TT.fac.yearly(); } M.purge = pg; });
  eq(gapBad, 0, 'cùng một tông không thanh trừng khi chưa đủ 80 năm'); ok(purges / 6 <= 6, 'hiếm: bình quân ' + (purges / 6).toFixed(1) + ' lần mỗi 300 năm');
  line('info', '   thanh trừng: ' + (purges / 6).toFixed(1) + ' lần mỗi 300 năm mỗi thế giới');
  // 8. Công tắc tắt: không thanh trừng, hệ số trung tính, sx đứng yên
  K.on = false; let off = 0; M.purge = function () { off++; return pg.apply(this, arguments); };
  eq(M.milMul(x), 1); eq(M.unityMul(x), 1); eq(M.wealthTrend(x), 0); eq(M.warMul(x), 1); eq(M.allyCut(x), 0); eq(M.recruitMul(x.id), 1);
  TT.life.createWorld(915); for (let y = 0; y < 300; y++) { TT.world.months += 12; TT.fac.yearly(); } M.purge = pg; K.on = true;
  eq(off, 0, 'tắt thì không thanh trừng'); ok(!TT.world.fac.sx, 'tắt thì không dựng sx');
  // 9. Đạo thống đọc theo thế giới đang chạy; lưu/tải; bản cũ; không đổi phiên bản
  TT.life.createWorld(916); const a = TT.fac.get('tc_thanh_van'), b = TT.fac.get('ts_kim_phong'), d0 = TT.diplo.daoBase(a, b);
  M.S(b.id).gt = M.S(a.id).gt.slice(); M.S(b.id).nhan = M.S(a.id).nhan; ok(TT.diplo.daoBase(a, b) > d0, 'giá trị gần nhau thì đạo thống tăng (theo thế giới)');

test('Dữ liệu tín ngưỡng (S5): chín tín ngưỡng đủ trường, lồng đối xứng, ba ô mỗi vùng hợp lệ, chữ không có tên nước thật', () => {

test('Chiến tranh tổng (S6b): đọc không gọi rng, khung mở đúng, giai đoạn theo thứ tự, kết đúng điều kiện, trần hậu quả, chỉ tiêu 150 năm, lưu/tải, tắt thì đóng, hiệu năng', () => {
  const TW = TT.totalwar, K = D.TOTALWAR, W = () => TT.world, F = () => TT.fac.S();
  const runYears = n => { for (let y = 0; y < n; y++) { W().months += 12; TT.fac.yearly(); } };
  // 1. Hàm đọc không gọi rng và không khởi tạo gì
  TT.life.createWorld(911); const st0 = TT.rng.getState();
  TW.on(); TW.cur(); TW.frontRegions({}); TW.phaseOf({ years: 3, dur: 12 }); TW.parts({ side: {} });
  eq(TT.rng.getState(), st0, 'hàm đọc không gọi rng'); ok(!F().tw && !F().twN, 'hàm đọc không mở chiến tranh');
  // 2. Giai đoạn: theo số năm, không lùi
  const ph = y => TW.phaseOf({ years: y, dur: 12 });
  eq(ph(0), 'bung_no'); eq(ph(2), 'bung_no'); eq(ph(3), 'giang_co'); eq(ph(7), 'giang_co'); eq(ph(8), 'kiet_suc'); eq(ph(10), 'kiet_suc'); eq(ph(11), 'nghi_hoa');
  // 3. Mở đúng khung: sáu đến chín bên, hai phe, 3 đến 4 chiến tuyến, 10 đến 18 năm; bên buộc chọn phe theo quan hệ S1
  const tw = TW.start({ force: true }); ok(tw && F().tw === tw, 'mở được chiến tranh tổng');
  const parts = TW.parts(tw);
  ok(parts.length >= K.sides.min && parts.length <= K.sides.max, 'số bên 6 đến 9: ' + parts.length);
  ok(tw.dur >= 10 && tw.dur <= 18, 'số năm 10 đến 18: ' + tw.dur);
  ok(tw.fronts.length >= 3 && tw.fronts.length <= 4, 'chiến tuyến 3 đến 4: ' + tw.fronts.length);
  ok(['a', 'b'].every(s => parts.some(x => tw.side[x.id] === s)), 'có đủ hai phe');
  ok(parts.every(x => x.war === 'tw' + tw.id && (x.kind === 'trieu' || x.kind === 'tong')), 'bên tham chiến là triều hoặc tông, đánh dấu chiến tranh');
  const A0 = TT.fac.get(tw.anchors[0]), B0 = TT.fac.get(tw.anchors[1]);
  parts.filter(x => x !== A0 && x !== B0).forEach(x => eq(tw.side[x.id], TT.fac.relV(x, A0) >= TT.fac.relV(x, B0) ? 'a' : 'b', 'chọn phe theo quan hệ: ' + x.n));
  tw.fronts.forEach(rid => ok(TT.eco.S().sh.some(x => x.kind === 'chien_tong' && x.region === rid), 'cú sốc chien_tong ở chiến tuyến ' + rid));
  // 4. Chạy đến kết: giai đoạn không lùi, dân chiến tuyến không giảm quá trần, kết cục ghi lại đúng
  const seen = ['bung_no'], floor = {}; tw.fronts.forEach(rid => { floor[rid] = tw.pop0[rid] * (1 - K.cap.pop); });
  let guard = 0;
  while (F().tw && guard++ < 30) {
    W().months += 12; TT.fac.yearly();
    if (tw.phase !== seen[seen.length - 1]) seen.push(tw.phase);
    tw.fronts.forEach(rid => ok(TT.pop.get(rid).n >= floor[rid] - 1e-6, 'dân vùng chiến tuyến không dưới trần 25%'));
  }
  ok(!F().tw, 'chiến tranh kết thúc trong 30 năm');
  const order = ['bung_no', 'giang_co', 'kiet_suc', 'nghi_hoa'];
  ok(seen.every((p, i) => i === 0 || order.indexOf(p) > order.indexOf(seen[i - 1])), 'giai đoạn theo thứ tự: ' + seen.join(' > '));
  const last = F().twLast; ok(last && last.n === tw.n && ['het_suc', 'mot_phe_thang', 'thien_menh', 'het_thoi_gian'].indexOf(last.kind) >= 0, 'ghi kết cục: ' + (last && last.kind));
  if (last.kind === 'het_thoi_gian') eq(tw.years, tw.dur, 'hết năm thì đúng số năm');
  if (last.kind === 'het_suc') ok(['kiet_suc', 'nghi_hoa'].indexOf(tw.phase) >= 0, 'hết sức chỉ đến khi kiệt sức hoặc nghị hòa');
  ok(F().chron.some(e => e.t.indexOf('bùng nổ') >= 0 && e.k === 'war'), 'sử ký ghi mở chiến tranh');
  ok(F().chron.some(e => e.t.indexOf(tw.n) >= 0 && /khép lại/.test(e.t)), 'sử ký ghi kết thúc');
  // 5. Hậu quả có trần: diệt vong, đổi chủ, chia cắt đếm từ sử ký của mỗi lần
  let maxD = 0, maxR = 0, maxC = 0;
  [101, 102, 103, 104, 105, 106, 107, 108, 109, 110].forEach(seed => {
    TT.life.createWorld(seed); const t2 = TW.start({ force: true }); if (!t2) return;
    for (let y = 0; y < 30 && F().tw; y++) { W().months += 12; TT.fac.yearly(); }
    const cnt = re => F().chron.filter(e => e.m >= t2.start && re.test(e.t)).length;
    maxD = Math.max(maxD, cnt(/bị tiêu diệt trong/)); maxR = Math.max(maxR, cnt(/ bị phế, /)); maxC = Math.max(maxC, cnt(/bị chia cắt trong/));
  });
  ok(maxD <= K.cap.destroy, 'diệt vong không quá trần: ' + maxD);
  ok(maxR <= K.cap.doiChu, 'đổi chủ không quá trần: ' + maxR);
  ok(maxC <= K.cap.chiaCat, 'chia cắt không quá trần: ' + maxC);
  // 6. Chỉ tiêu 150 năm: mở tự động không quá một lần trong 150 năm, dù điều kiện luôn đủ
  TT.life.createWorld(77); const starts = [];
  const tws = TW.start; TW.start = function (o) { const r = tws.apply(this, arguments); if (r) starts.push(W().months); return r; };
  try {
    for (let y = 0; y < 300; y++) {
      TT.fac.list('trieu').forEach(x => { TT.nation.ent(x).van = 5; });
      W().months += 12; TT.fac.yearly();
    }
  } finally { TW.start = tws; }
  for (let i = 1; i < starts.length; i++) ok(starts[i] - starts[i - 1] >= K.open.gapYears * 12, 'hai đại chiến cách nhau đủ 150 năm');
  // 7. Lưu/tải giữa chiến tranh; bản cũ không có trường mới vẫn chạy
  TT.life.createWorld(905); TW.start({ force: true }); runYears(3);
  const snap = TT.save.snapshot(), before = JSON.stringify(F().tw);
  TT.life.createWorld(5); TT.save.restore(snap);
  eq(JSON.stringify(F().tw), before, 'lưu/tải giữ chiến tranh đang diễn ra');
  runYears(3); ok(true, 'tiếp tục sau khi tải');
  delete F().tw; delete F().twAt; delete F().twN; runYears(20); ok(true, 'bản cũ không có chiến tranh tổng vẫn chạy');
  // 8. Công tắc tắt: không mở, không gọi, không ghi trường mới
  K.on = false; TT.life.createWorld(913); runYears(80);
  ok(!F().tw && !F().twN && !F().twAt, 'tắt: không mở chiến tranh tổng nào');
  eq(TW.start({ force: true }), null, 'tắt: start trả về null');
  K.on = true;
  // 9. Hiệu năng: 300 năm có chiến tranh tổng dưới một giây
  TT.life.createWorld(5); const t1 = performance.now(); runYears(300); const ms = performance.now() - t1;
  ok(ms < 1000, '300 năm mất ' + Math.round(ms) + ' ms');
  // 10. Chữ trong game không nhắc tên nước thật
  const txt = JSON.stringify([K.names, K.reasons, K.phaseName]);
  ['Trung Quốc', 'Nhật Bản', 'Mỹ', 'Nga', 'Đức', 'Ấn Độ', 'Mông Cổ', 'Iran', 'Venice', 'La Mã', 'Hà Lan', 'Ottoman', 'Viking', 'Khmer'].forEach(w => ok(txt.indexOf(w) < 0, 'chữ không nhắc tên nước thật: ' + w));
  line('info', '   300 năm có chiến tranh tổng: ' + Math.round(ms) + ' ms; mở tự động trong 300 năm ép điều kiện: ' + starts.length + ' lần; kết cục mẫu: ' + (last.kind) + ' sau ' + tw.years + ' năm');
});

    const rows = Array.prototype.map.call(box.querySelectorAll('.small'), e => e.textContent).filter(t => t.indexOf('Triều chính:') === 0);
    eq(rows.length, 9, 'chín thẻ triều có hàng triều chính');
    ok(rows.every(t => /hoàng quyền (mạnh|vừa|yếu)/.test(t) && !/\d/.test(t)), 'hàng triều chính chỉ chữ và bậc, không số');
  }
  // 11. Hiệu năng và chữ trong game
  TT.life.createWorld(5); const t1 = performance.now(); runYears(300); const ms = performance.now() - t1;

  ['Trung Quốc', 'Nhật Bản', 'Mỹ', 'Nga', 'Đức', 'Ấn Độ', 'Mông Cổ', 'Iran', 'Venice', 'La Mã', 'Hà Lan', 'Ottoman', 'Viking', 'Khmer'].forEach(w => ok(txt.indexOf(w) < 0, 'chữ không nhắc tên nước thật: ' + w));
  line('info', '   300 năm có triều chính và F2 phần sau: ' + Math.round(ms) + ' ms');

test('Liên tông (S8): đọc không gọi rng, vai trò và bổng, quốc sư, thao túng và phản phệ, minh ước và ước pháp, giải đấu và báo danh, đại chiến và trần, Thiên hạ công ước, lưu/tải, bản cũ, tắt, hiệu năng', () => {
  const I = TT.inter, K = D.INTERSECT, F = () => TT.fac.S(), W = () => TT.world, T = () => TT.fac.list('tong').filter(TT.fac.alive);
  const TR = () => TT.fac.list('trieu').filter(TT.fac.alive);
  const runYears = n => { for (let y = 0; y < n; y++) { W().months += 12; TT.fac.yearly(); } };
  // 1. Hàm đọc không gọi rng và không tạo bản ghi
  TT.life.createWorld(911); TT.pact.S(); const st0 = TT.rng.getState(), t0 = T()[0], x0 = TR()[0];
  I.peekS(); I.roleOf(t0); I.armyMul(x0); I.manip(x0); I.helpBonus(t0.id, T()[1].id); I.mineAdd(t0.id); I.giaiOpen(); I.describe(t0); I.uocPairs(); I.bigWars(); I.sig(); I.trieuOfRegion(t0.region); I.entered({ sect: { id: t0.id } });
  eq(TT.rng.getState(), st0, 'hàm đọc không gọi rng');
  ok(!F().inter, 'hàm đọc không tạo bản liên tông');
  // 2. Vai trò và bổng: cung phụng có hiệp ước bổng từ triều; rời vai trò thì bổng tan
  TT.life.createWorld(913); TT.pact.S(); const tr2 = TR()[0], t2 = T().find(t => t.region === tr2.region) || T()[0];
  I.setRole(t2, 'cung_phung');
  ok(I.roleOf(t2) === 'cung_phung' && TT.pact.S().some(p => p.kind === 'bong' && p.b === t2.id), 'cung phụng có hiệp ước bổng');
  I.setRole(t2, 'tu_do');
  ok(!TT.pact.S().some(p => p.kind === 'bong' && p.b === t2.id) && I.roleOf(t2) === 'tu_do', 'rời cung phụng thì bổng tan');
  // 3. Quốc sư tăng quân lực của triều đúng mức; vai trò khác không tăng
  I.setRole(t2, 'quoc_su'); const trq = TT.fac.list('trieu').find(x => x.region === t2.region);
  eq(I.armyMul(trq), 1 + K.role.armyBonus, 'quốc sư: hệ số quân lực đúng mức');
  I.setRole(t2, 'tu_do'); eq(I.armyMul(trq), 1, 'không phải quốc sư thì không tăng quân');
  // 4. Ngoài vòng pháp luật: triều yếu thì có thể thành; trừng phạt đưa tông về tự do và trừ sức
  TT.life.createWorld(915); TT.pact.S(); const tr4 = TR()[0], t4 = T().find(t => t.region === tr4.region) || T()[0];
  const P4 = { o: K.outlaw.p, pu: K.punish.p, hq: K.punish.hq };
  try {
    K.outlaw.p = 1; t4.power = 90; TT.court.ent(tr4).hq = 20; I.roleStep(tr4, 1);
    ok(I.roleOf(t4) === 'ngoai_phap', 'triều yếu, tông mạnh thì thành ngoài vòng pháp luật');
    const pw = t4.power; K.punish.p = 1; TT.court.ent(tr4).hq = 70; I.roleStep(tr4, 2);
    ok(I.roleOf(t4) === 'tu_do' && t4.power < pw, 'triều mạnh thì trừng phạt, tông trở về tự do và mất sức');
  } finally { K.outlaw.p = P4.o; K.punish.p = P4.pu; K.punish.hq = P4.hq; }
  // 5. Thao túng kế vị: chỉ quốc sư hoặc cung phụng đủ mạnh; phản phệ khi quốc vận còn cao, trơn tru khi vận mạt
  TT.life.createWorld(917); TT.pact.S(); const tr5 = TR()[0], t5 = T().find(t => t.region === tr5.region) || T()[0];
  const P5 = K.manip.p; try {
    K.manip.p = 1; t5.power = 80; I.setRole(t5, 'tu_do');
    ok(I.manip(tr5) === null, 'tông tự do không thao túng được kế vị');
    I.setRole(t5, 'quoc_su'); ok(I.manip(tr5) === t5, 'quốc sư đủ mạnh thao túng được kế vị');
    const N5 = TT.nation.ent(tr5); N5.van = 85; const p5 = t5.power, u5 = t5.unity;
    I.backlash(tr5, t5);
    ok(t5.power < p5 && t5.unity < u5, 'quốc vận còn cao: tông chịu phản phệ');
    N5.van = 10; const p5b = t5.power; I.backlash(tr5, t5);
    ok(t5.power > p5b, 'quốc vận mạt: thao túng trơn tru, tông được thêm sức');
    K.manip.p = 0; ok(I.manip(tr5) === null, 'không có xác suất thì không thao túng');
  } finally { K.manip.p = P5; }
  // 6. Minh ước liên tông: ước pháp đi cùng minh ước; có giúp thêm, chia mỏ; tan khi minh ước tan
  TT.life.createWorld(919); TT.pact.S(); const [a6, b6] = T().slice(0, 2);
  a6.ally = (a6.ally || []).concat([b6.id]); b6.ally = (b6.ally || []).concat([a6.id]);
  TT.fac.relAdd(a6, b6, 100, ['hoa_nghi', 'thử ước pháp']);
  TT.pact.add('minh_uoc', a6.id, b6.id, {});
  const P6 = K.uoc.p; try { K.uoc.p = 1; I.uocStep(1); } finally { K.uoc.p = P6; }
  const up = TT.pact.S().find(p => p.kind === 'uoc_phap');
  ok(!!up && up.rate === 0, 'minh ước đủ thân thì thêm ước pháp, không trả kho');
  ok(I.helpBonus(a6.id, b6.id) === K.uoc.help, 'ước pháp giúp đồng minh thêm khi lâm chiến');
  const hpWith = TT.pact.helpP(a6.id, b6.id), iu = TT.pact.S().indexOf(up); TT.pact.S().splice(iu, 1);
  const hpWithout = TT.pact.helpP(a6.id, b6.id); TT.pact.S().push(up);
  ok(hpWith > hpWithout, 'pact.helpP cộng ước pháp khi lâm chiến');
  b6.res = b6.res || { mach: 1, mo: 2 }; ok(I.mineAdd(a6.id) > 0, 'chia mỏ: đồng minh có mỏ thì được chia phần');
  const mu = TT.pact.S().findIndex(p => p.kind === 'minh_uoc' && ((p.a === a6.id && p.b === b6.id) || (p.a === b6.id && p.b === a6.id)));
  TT.pact.S().splice(mu, 1);
  I.uocStep(2); ok(!TT.pact.S().some(p => p.kind === 'uoc_phap'), 'minh ước tan thì ước pháp tan');
  // 7. Giải đấu: chu kỳ 4 hoặc 10 năm; bốc thăm xong thì lên lịch kỳ sau; báo danh chỉ trong năm trước kỳ
  TT.life.createWorld(921); TT.pact.S(); const G7 = I.giaiS();
  ok(K.giai.cycles.indexOf(G7.cycle) >= 0, 'chu kỳ giải là 4 hoặc 10 năm: ' + G7.cycle);
  const n7 = G7.next; W().months = n7; I.giaiStep();
  ok(G7.next === n7 + G7.cycle * 12 && !!G7.last, 'đến kỳ thì bốc thăm và lên lịch kỳ sau');
  ok(G7.tuCach[G7.last.win] > W().months, 'người thắng có tư cách minh chủ');
  const pl7 = TT.player(), sv7 = pl7.sect; const t7 = T()[0];
  try {
    W().months = G7.next - 72; ok(!I.giaiOpen(), 'sáu năm trước kỳ chưa mở báo danh');
    W().months = G7.next - 6; pl7.sect = { id: t7.id, rank: 1 };
    ok(I.giaiOpen(), 'trong năm trước kỳ thì mở báo danh');
    ok(I.enter(pl7).ok && I.entered(pl7), 'thành viên báo danh được');
    ok(I.enter(pl7).ok && !I.entered(pl7), 'báo danh lần hai là rút tên');
    pl7.sect = null; ok(!I.enter(pl7).ok, 'không thuộc tông thì không báo danh được');
  } finally { pl7.sect = sv7; }
  // 8. Đại chiến liên tông: triều nhúng tay theo băm; cho mượn quân cộng điểm; cấm vận trừ kho; giới hạn một lần mỗi 150 năm; thua có hậu quả
  TT.life.createWorld(923); TT.pact.S(); const [a8, b8] = T().slice(0, 2), tr8 = TT.fac.list('trieu').find(x => x.region === b8.region) || TR()[0];
  const P8 = { n: K.war.nhung, hq: K.war.hqNhung, c: K.war.cam };
  try {
    K.war.nhung = 1; K.war.hqNhung = 0; I.S().lastBig = -99999;
    const w8 = { id: 77, a: a8.id, b: b8.id, war: 0, years: 0, sa: [], sb: [], score: 0 };
    I.warStart(w8, a8, b8);
    ok(w8.lt === 1 && w8.stance === 'nhung_tay' && (w8.side === a8.id || w8.side === b8.id), 'triều cho mượn quân và chọn bên: ' + w8.stance);
    const bias = I.warTick(w8); ok(Math.abs(bias) === K.war.bias, 'cho mượn quân cộng điểm chiến về phía bên được giúp');
    const w9 = { id: 78, a: a8.id, b: b8.id, war: 0, years: 0, sa: [], sb: [], score: 0 };
    I.warStart(w9, a8, b8); ok(!w9.lt && w9.stance === 'dung_ngoai', 'trong 150 năm không có đại chiến liên tông thứ hai');
    const hq8 = TT.court.ent(tr8).hq; I.warEnd(w8, 'a');
    ok(TT.court.ent(tr8).hq < hq8, 'triều mất uy sau đại chiến liên tông');
    K.war.nhung = 0; K.war.cam = 1; I.S().lastBig = -99999; const w10 = { id: 79, a: a8.id, b: b8.id, war: 0, years: 0, sa: [], sb: [], score: 0 };
    const wa = a8.wealth; I.warStart(w10, a8, b8);
    eq(w10.stance, 'cam_van', 'cấm vận');
    I.warTick(w10); ok(a8.wealth <= wa, 'cấm vận làm kho hai bên giảm');
  } finally { K.war.nhung = P8.n; K.war.hqNhung = P8.hq; K.war.cam = P8.c; }
  // 9. Thiên hạ công ước: quốc sư hoặc cung phụng và triều ký; ngoài vòng pháp luật thì vỡ và tông bị truy cứu
  TT.life.createWorld(925); TT.pact.S(); const tr9 = TR()[0], t9 = T().find(t => t.region === tr9.region) || T()[0];
  I.setRole(t9, 'quoc_su'); const P9 = K.cong.p; try { K.cong.p = 1; I.congStep(1); } finally { K.cong.p = P9; }
  ok(I.S().cong[t9.region] === W().months, 'quốc sư và triều ký Thiên hạ công ước');
  const p9 = t9.power; I.setRole(t9, 'ngoai_phap');
  ok(I.S().cong[t9.region] === -1 && t9.power < p9, 'vi phạm công ước: công ước vỡ và tông bị truy cứu');
  // 10. Trần hệ quả: diệt tông làm đồng minh thù, quan hệ luôn trong [-100, 100]
  TT.life.createWorld(927); TT.pact.S(); runYears(3);
  T().forEach(t => T().forEach(u => { if (t !== u) { const v = TT.diplo.total(t, u); ok(v >= -100 && v <= 100, 'quan hệ trong trần'); } }));
  // 11. Lưu/tải giữ nguyên trạng thái mới; bản cũ không có trường mới vẫn chạy
  TT.life.createWorld(929); TT.pact.S(); I.setRole(T()[0], 'cung_phung'); runYears(40);
  const snap = TT.save.snapshot(), j0 = JSON.stringify([F().inter, F().pacts]);
  TT.life.createWorld(5); TT.save.restore(snap);
  eq(JSON.stringify([F().inter, F().pacts]), j0, 'lưu/tải giữ liên tông và ước pháp mới');
  runYears(10); ok(true, 'tiếp tục sau khi tải');
  delete F().inter; F().pacts = F().pacts.filter(p => ['bong', 'uoc_phap'].indexOf(p.kind) < 0);
  runYears(20); ok(T().every(t => ['tu_do', 'quoc_su', 'cung_phung', 'ngoai_phap'].indexOf(I.roleOf(t)) >= 0), 'bản cũ không có liên tông vẫn chạy');
  // 12. Đại chiến liên tông đếm riêng và không quá một lần mỗi 150 năm (chạy 300 năm)
  TT.life.createWorld(931); TT.pact.S(); const starts = []; const sw = TT.fac.startWar;
  TT.fac.startWar = function () { const r = sw.apply(this, arguments); const last = F().wars.slice(-1)[0]; if (last && last.lt) starts.push(W().months); return r; };
  try { runYears(300); } finally { TT.fac.startWar = sw; }
  let gap = Infinity; for (let i = 1; i < starts.length; i++) gap = Math.min(gap, starts[i] - starts[i - 1]);
  ok(gap === Infinity || gap >= K.war.gap * 12, 'đại chiến liên tông cách nhau ít nhất 150 năm: ' + starts.length + ' lần');
  // 13. Công tắc tắt: không tạo gì, không có ước pháp hay bổng, quân lực và chia mỏ trung tính
  K.on = false; try {
    TT.life.createWorld(917); TT.pact.S(); const x13 = TR()[0];

    ok(!F().pacts.some(p => ['bong', 'uoc_phap'].indexOf(p.kind) >= 0), 'tắt: không có bổng hay ước pháp');
    eq(I.armyMul(x13), 1, 'tắt: quân lực không đổi vì liên tông');
    eq(I.helpBonus(1, 2), 0, 'tắt: không có điểm giúp thêm');
    ok(!I.giaiOpen() && I.describe(T()[0]).roleKey === 'tu_do', 'tắt: đọc trả về trung tính');
  } finally { K.on = true; }

  TT.life.createWorld(929); runYears(3);
  if (TT.ui && TT.ui.interBlock) {
    const box = document.createElement('div');
    TT.ui.interBlock(box, TT.player(), false);
    const txt = box.textContent;
    ok(txt.indexOf('Liên tông') >= 0 && !/\d/.test(txt), 'mục liên tông chỉ chữ và bậc, không số');

  line('info', '   300 năm có liên tông: ' + Math.round(ms) + ' ms');
});
